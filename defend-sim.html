<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Defend the Tower</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; }
canvas { display:block; image-rendering:pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = 900; cv.height = 560;

// ── Colours ──────────────────────────────────────────────────────────────────
const C = {
  ground:'#4caf50', groundDark:'#388e3c', border:'#5d4037',
  player:'#1565c0', playerGun:'#ffa000', playerHead:'#ffcc80',
  tower:'#78909c', towerTop:'#546e7a', towerLight:'#e3f2fd',
  bullet:'#ffeb3b', bulletGlow:'rgba(255,235,70,0.6)',
  enemy1:'#d32f2f', enemy2:'#7b1fa2', enemy3:'#e64a19',
  enemyHpBg:'#333', enemyHp:'#f44336',
  ui:'#000', uiBg:'rgba(0,0,0,0.55)',
  xpBg:'#1a237e', xpFill:'#3f51b5', xpGlow:'#7986cb',
  flash:'rgba(255,255,255,0.9)',
};

const W = cv.width, H = cv.height;
let t = 0, wave = 1, kills = 0, maxKills = 10, xp = 0, maxXp = 100;

// ── Tower ────────────────────────────────────────────────────────────────────
const TOWER = { x: W/2, y: H/2 - 20, r: 26 };

// ── Player ───────────────────────────────────────────────────────────────────
const player = { x: W/2, y: H/2 + 70, vx:0, vy:0, angle:0, shootCd:0, hp:100 };
const PLAYER_SPEED = 1.8;
const WAYPOINTS = [
  {x: W/2-120, y: H/2+90}, {x: W/2+120, y: H/2+90},
  {x: W/2+120, y: H/2-80}, {x: W/2-120, y: H/2-80},
];
let wpIdx = 0;

// ── Bullets ──────────────────────────────────────────────────────────────────
const bullets = [];
const BULLET_SPEED = 8;

// ── Enemies ──────────────────────────────────────────────────────────────────
const enemies = [];
let spawnTimer = 120; // frames until next spawn
const ENEMY_TYPES = [
  { col: C.enemy1, speed: 0.85, hp: 30, r: 14, xpVal: 8  },
  { col: C.enemy2, speed: 0.65, hp: 55, r: 16, xpVal: 15 },
  { col: C.enemy3, speed: 1.1,  hp: 20, r: 12, xpVal: 5  },
];
const particles = [];

function spawnEnemy() {
  const side = Math.floor(Math.random()*4);
  let x,y;
  if (side===0) { x=Math.random()*W; y=-20; }
  else if (side===1) { x=W+20; y=Math.random()*H; }
  else if (side===2) { x=Math.random()*W; y=H+20; }
  else { x=-20; y=Math.random()*H; }
  const type = ENEMY_TYPES[Math.floor(Math.random()*ENEMY_TYPES.length)];
  enemies.push({ x, y, hp: type.hp, maxHp: type.hp, ...type, flashTimer:0 });
}

function spawnParticles(x,y,col,n=8) {
  for (let i=0;i<n;i++) {
    const a = Math.random()*Math.PI*2;
    const s = 2+Math.random()*4;
    particles.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:20+Math.random()*15, col });
  }
}

// ── Draw helpers ──────────────────────────────────────────────────────────────
function drawPixelChar(x,y,facing) {
  const s = facing;
  // Body
  ctx.fillStyle='#1565c0';
  ctx.fillRect(x-7,y-4,14,14);
  // Head
  ctx.fillStyle='#ffcc80';
  ctx.fillRect(x-5,y-13,10,10);
  // Eyes
  ctx.fillStyle='#333';
  ctx.fillRect(x+(s>0?1:-5),y-11,3,2);
  // Gun
  ctx.fillStyle='#ffa000';
  ctx.fillRect(x+(s>0?7:-14),y-2,7,4);
  // Legs (animate)
  const legOff = Math.sin(t*0.18)*4;
  ctx.fillStyle='#0d47a1';
  ctx.fillRect(x-6, y+10, 5, 7+legOff);
  ctx.fillRect(x+1,  y+10, 5, 7-legOff);
  // Feet
  ctx.fillStyle='#333';
  ctx.fillRect(x-7, y+15+legOff, 6, 3);
  ctx.fillRect(x+2,  y+15-legOff, 6, 3);
}

function drawEnemy(e) {
  // Flash on hit
  if (e.flashTimer > 0) {
    ctx.fillStyle = C.flash;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r+2, 0, Math.PI*2); ctx.fill();
    return;
  }
  // Body
  ctx.fillStyle = e.col;
  ctx.fillRect(e.x-e.r, e.y-e.r, e.r*2, e.r*2);
  // Face
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.fillRect(e.x-e.r+3, e.y-e.r+3, e.r*2-6, e.r*2-6);
  // Eyes glow
  ctx.fillStyle='#ffeb3b';
  ctx.fillRect(e.x-5, e.y-4, 4, 4);
  ctx.fillRect(e.x+1, e.y-4, 4, 4);
  // HP bar
  const bw = e.r*2+6, bh = 5;
  const bx = e.x-e.r-3, by = e.y-e.r-10;
  ctx.fillStyle=C.enemyHpBg; ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=C.enemyHp;   ctx.fillRect(bx,by,bw*(e.hp/e.maxHp),bh);
}

function drawBullet(b) {
  ctx.save();
  ctx.shadowBlur = 12; ctx.shadowColor = C.bulletGlow;
  ctx.fillStyle = C.bullet;
  ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawTower() {
  // Base
  ctx.fillStyle = C.tower;
  ctx.fillRect(TOWER.x-22, TOWER.y-30, 44, 55);
  // Battlements
  ctx.fillStyle = C.towerTop;
  for (let i=0;i<4;i++) ctx.fillRect(TOWER.x-20+i*12, TOWER.y-42, 8, 14);
  // Door
  ctx.fillStyle='#3e2723';
  ctx.fillRect(TOWER.x-8, TOWER.y+8, 16, 18);
  // Window
  ctx.fillStyle = C.towerLight;
  ctx.fillRect(TOWER.x-5, TOWER.y-18, 10, 10);
  // Glow from window
  const wg = ctx.createRadialGradient(TOWER.x, TOWER.y-12, 1, TOWER.x, TOWER.y-12, 35);
  wg.addColorStop(0,'rgba(150,220,255,0.12)');
  wg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=wg; ctx.fillRect(TOWER.x-40,TOWER.y-50,80,80);
}

function drawGround() {
  // Grass
  ctx.fillStyle = C.ground;
  ctx.fillRect(0,0,W,H);
  // Tiles
  ctx.strokeStyle = C.groundDark; ctx.lineWidth=1; ctx.globalAlpha=0.18;
  for(let x=0;x<W;x+=40) { ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke(); }
  for(let y=0;y<H;y+=40) { ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }
  ctx.globalAlpha=1;
  // Border strip
  ctx.fillStyle=C.border;
  ctx.fillRect(0,H-16,W,16);
  ctx.fillRect(0,0,W,4);
  ctx.fillRect(0,0,4,H);
  ctx.fillRect(W-4,0,4,H);
}

function drawUI() {
  // Top bar background
  ctx.fillStyle = C.uiBg;
  ctx.fillRect(0, 0, W, 46);
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,46);ctx.lineTo(W,46);ctx.stroke();

  // Wave
  ctx.fillStyle='#fff'; ctx.font='bold 16px monospace';
  ctx.fillText(`Wave: ${wave}`, 18, 27);

  // Kill counter
  const kx = W-200;
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.fillRect(kx,8,180,30);
  ctx.fillStyle='#90caf9'; ctx.font='12px monospace';
  ctx.fillText(`KILLS: ${kills} / ${maxKills}`, kx+10, 22);
  // Kill bar
  ctx.fillStyle='#1e3a5f'; ctx.fillRect(kx+8,26,164,8);
  ctx.fillStyle='#42a5f5'; ctx.fillRect(kx+8,26,164*(kills/maxKills),8);
  ctx.strokeStyle='rgba(66,165,245,0.4)';ctx.lineWidth=1;
  ctx.strokeRect(kx+8,26,164,8);

  // XP bar bottom
  const xbx=4, xby=H-14, xbw=W-8, xbh=10;
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(xbx-2,H-18,xbw+4,14);
  ctx.fillStyle=C.xpBg; ctx.fillRect(xbx,xby,xbw,xbh);
  // Animated fill
  ctx.fillStyle=C.xpFill; ctx.fillRect(xbx,xby,xbw*(xp/maxXp),xbh);
  ctx.fillStyle='rgba(255,255,255,0.09)';ctx.fillRect(xbx,xby,xbw,5);
  ctx.fillStyle='#7986cb'; ctx.font='9px monospace';
  ctx.fillText(`XP  ${Math.floor(xp)} / ${maxXp}`,xbx+6,xby+8);

  // Compass corners
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(W-60,H-60,56,56);
  ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.strokeRect(W-60,H-60,56,56);
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.font='9px monospace';
  ctx.fillText('MAP', W-47, H-45);
  // Player dot on map
  const mx = (player.x/W)*50, my = (player.y/H)*50;
  ctx.fillStyle='#42a5f5'; ctx.beginPath();ctx.arc(W-58+mx,H-58+my,3,0,Math.PI*2);ctx.fill();
  // Tower dot
  ctx.fillStyle='#78909c'; ctx.beginPath();ctx.arc(W-58+25,H-58+25,4,0,Math.PI*2);ctx.fill();
  // Enemy dots
  for (const e of enemies) {
    const ex=(e.x/W)*50, ey=(e.y/H)*50;
    ctx.fillStyle=e.col; ctx.beginPath();ctx.arc(W-58+ex,H-58+ey,2,0,Math.PI*2);ctx.fill();
  }
}

// ── Game loop ─────────────────────────────────────────────────────────────────
function update() {
  t++;

  // Player AI: patrol waypoints
  const wp = WAYPOINTS[wpIdx];
  const dx = wp.x - player.x, dy = wp.y - player.y;
  const dist = Math.hypot(dx,dy);
  if (dist < 12) { wpIdx = (wpIdx+1) % WAYPOINTS.length; }
  else {
    player.x += (dx/dist)*PLAYER_SPEED;
    player.y += (dy/dist)*PLAYER_SPEED;
  }

  // Player faces direction of movement
  if (dx !== 0) player.facing = dx > 0 ? 1 : -1;

  // Aim at nearest enemy and shoot
  player.shootCd--;
  if (enemies.length > 0) {
    let nearest = enemies[0], nd = Infinity;
    for (const e of enemies) {
      const d = Math.hypot(e.x-player.x, e.y-player.y);
      if (d < nd) { nd=d; nearest=e; }
    }
    player.angle = Math.atan2(nearest.y-player.y, nearest.x-player.x);
    if (player.shootCd <= 0) {
      bullets.push({ x:player.x+Math.cos(player.angle)*16, y:player.y+Math.sin(player.angle)*16, vx:Math.cos(player.angle)*BULLET_SPEED, vy:Math.sin(player.angle)*BULLET_SPEED, life:80 });
      player.shootCd = 12 + Math.floor(Math.random()*6);
    }
  }

  // Spawn enemies
  spawnTimer--;
  if (spawnTimer <= 0 && enemies.length < 6) {
    spawnEnemy();
    spawnTimer = 55 + Math.floor(Math.random()*40);
  }
  // Guarantee enemies after 3s
  if (t === 80 && enemies.length === 0) { spawnEnemy(); spawnEnemy(); spawnTimer = 60; }

  // Move enemies
  for (let i = enemies.length-1; i >= 0; i--) {
    const e = enemies[i];
    if (e.flashTimer > 0) { e.flashTimer--; }
    const dx = TOWER.x - e.x, dy = TOWER.y - e.y;
    const d = Math.hypot(dx,dy);
    e.x += (dx/d)*e.speed; e.y += (dy/d)*e.speed;
    // Die if reaching tower
    if (d < TOWER.r + e.r) { spawnParticles(e.x,e.y,'#ef5350',6); enemies.splice(i,1); }
  }

  // Move bullets
  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.life <= 0 || b.x<0||b.x>W||b.y<0||b.y>H) { bullets.splice(i,1); continue; }
    // Hit enemies
    let hit = false;
    for (let j = enemies.length-1; j >= 0; j--) {
      const e = enemies[j];
      if (Math.hypot(b.x-e.x, b.y-e.y) < e.r+4) {
        e.hp -= 10; e.flashTimer = 3;
        spawnParticles(b.x, b.y, e.col, 4);
        bullets.splice(i,1); hit=true;
        if (e.hp <= 0) {
          spawnParticles(e.x, e.y, e.col, 12);
          xp = Math.min(maxXp, xp + e.xpVal);
          kills++;
          if (kills >= maxKills) { wave++; kills=0; maxKills+=5; xp=0; spawnTimer=20; }
          enemies.splice(j,1);
        }
        break;
      }
    }
  }

  // Particles
  for (let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life--;
    if(p.life<=0) particles.splice(i,1);
  }

  // XP slow drift up even without kills (for visual)
  if (t % 3 === 0 && xp < maxXp) xp = Math.min(maxXp, xp + 0.18);
}

function draw() {
  ctx.clearRect(0,0,W,H);
  drawGround();
  drawTower();

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life/35;
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;

  // Enemies
  for (const e of enemies) drawEnemy(e);

  // Bullets
  for (const b of bullets) drawBullet(b);

  // Player
  drawPixelChar(player.x, player.y, player.facing || 1);

  // Shoot beam (subtle)
  if (enemies.length > 0 && player.shootCd < 4) {
    ctx.save();
    ctx.globalAlpha=0.22;
    ctx.strokeStyle='#ffeb3b'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(player.x,player.y);
    ctx.lineTo(player.x+Math.cos(player.angle)*300, player.y+Math.sin(player.angle)*300);
    ctx.stroke();
    ctx.restore();
  }

  drawUI();
}

function loop() {
  update(); draw();
  requestAnimationFrame(loop);
}

// Pre-seed 2 enemies near edges so they're visible immediately
setTimeout(() => { spawnEnemy(); spawnEnemy(); }, 400);
loop();
</script>
</body>
</html>
