<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jimi Hughes — Creator / AI Engineer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="description" content="Portfolio of Jimi Hughes — creator and AI engineer building apps, games, and tools for the web.">
  <meta property="og:title" content="Jimi Hughes — Creator / AI Engineer">
  <meta property="og:description" content="Apps, games, and AI tools built for the web.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jimihughes.com">
  <meta property="og:image" content="https://jimihughes.com/images/og-cover.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    /* ──────────────────────────────────────────────
       RESET + ROOT
    ────────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #06060f; color: #e2e2ee; font-family: 'Space Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
    *::-webkit-scrollbar { width: 4px; height: 4px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; }

    :root {
      --bg:       #06060f;
      --surf:     rgba(11,11,22,0.94);
      --surf2:    rgba(20,20,38,0.82);
      --bd:       rgba(255,255,255,0.07);
      --bd2:      rgba(255,255,255,0.13);
      --txt:      #e2e2ee;
      --txt2:     rgba(226,226,238,0.52);
      --txt3:     rgba(226,226,238,0.28);
      --blue:     #1a6cff;
      --blue-dim: rgba(26,108,255,0.18);
      --orange:   #ff6b35;
      --purple:   #9333ea;
      --green:    #10b981;
      --red:      #ff5f57;
      --yellow:   #febc2e;
      --limegreen:#28c840;
      --shadow:   0 28px 70px rgba(0,0,0,0.72), 0 0 0 1px rgba(255,255,255,0.06);
      --shadow-sm:0 8px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
      --font:     'Space Grotesk', system-ui, sans-serif;
      --mono:     'JetBrains Mono', 'Courier New', monospace;
      --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
      --ease-out:    cubic-bezier(0.22,1,0.36,1);
    }

    /* ──────────────────────────────────────────────
       BOOT SCREEN
    ────────────────────────────────────────────── */
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 32px;
      transition: opacity 0.7s ease;
    }
    #boot.out { opacity: 0; pointer-events: none; }

    .boot-logo {
      display: flex; align-items: center; gap: 16px;
      animation: boot-fade-up 0.6s var(--ease-out) 0.2s both;
    }
    @keyframes boot-fade-up {
      from { opacity:0; transform: translateY(12px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .boot-icon {
      width: 56px; height: 56px; border-radius: 16px;
      background: linear-gradient(135deg, #0a2a80, #1a6cff);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 48px rgba(26,108,255,0.45), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .boot-icon svg { width: 28px; height: 28px; }

    .boot-wordmark {
      font-family: var(--mono); font-size: 30px; font-weight: 600; letter-spacing: -0.02em; color: #fff;
    }
    .boot-wordmark em { color: var(--blue); font-style: normal; }

    .boot-bar-wrap {
      width: 220px; height: 2px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden;
      animation: boot-fade-up 0.5s var(--ease-out) 0.4s both;
    }
    #boot-bar { height: 100%; width: 0; background: var(--blue); border-radius: 2px; box-shadow: 0 0 14px var(--blue); transition: width 0.12s linear; }

    #boot-msg {
      font-family: var(--mono); font-size: 11px; color: rgba(255,255,255,0.28); letter-spacing: 0.05em;
      animation: boot-fade-up 0.5s var(--ease-out) 0.5s both;
      min-height: 1em;
    }

    /* ──────────────────────────────────────────────
       DESKTOP
    ────────────────────────────────────────────── */
    #desktop {
      position: fixed; inset: 0; overflow: hidden;
      opacity: 0; transition: opacity 0.7s ease;
    }
    #desktop.on { opacity: 1; }

    /* wallpaper gradient */
    #desktop::before {
      content: '';
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 80% 70% at 15% 55%, rgba(0,60,200,0.07) 0%, transparent 65%),
        radial-gradient(ellipse 55% 80% at 82% 15%, rgba(110,0,200,0.05) 0%, transparent 60%),
        radial-gradient(ellipse 65% 55% at 55% 92%, rgba(0,120,220,0.04) 0%, transparent 55%);
    }

    #bg-canvas { position: absolute; inset: 0; z-index: 0; pointer-events: none; }

    /* ──────────────────────────────────────────────
       MENU BAR
    ────────────────────────────────────────────── */
    #menubar {
      position: absolute; top: 0; left: 0; right: 0; height: 28px; z-index: 300;
      display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
      background: rgba(6,6,15,0.72);
      backdrop-filter: blur(48px) saturate(200%); -webkit-backdrop-filter: blur(48px) saturate(200%);
      border-bottom: 1px solid rgba(255,255,255,0.055);
    }
    #mb-left { display: flex; align-items: center; gap: 4px; }
    #mb-right { display: flex; align-items: center; gap: 14px; }

    .mb-logo {
      display: flex; align-items: center; gap: 6px; margin-right: 8px; cursor: default;
    }
    .mb-logo-dot { width: 16px; height: 16px; border-radius: 4px; background: linear-gradient(135deg,#0a2a80,#1a6cff); display:flex;align-items:center;justify-content:center; }
    .mb-logo-dot svg { width:9px;height:9px; }
    .mb-logo-name { font-family:var(--mono); font-size:12px; font-weight:600; color:#fff; letter-spacing:-0.01em; }
    .mb-logo-name em { color:var(--blue); font-style:normal; }

    .mb-btn {
      font-size: 12px; color: var(--txt2); padding: 2px 7px; border-radius: 4px;
      cursor: pointer; transition: color 0.15s, background 0.15s; border: none; background: none;
    }
    .mb-btn:hover { color: var(--txt); background: rgba(255,255,255,0.07); }
    #mb-clock { font-family: var(--mono); font-size: 11px; color: var(--txt2); min-width: 42px; text-align: right; }

    /* ──────────────────────────────────────────────
       DESKTOP SCROLL AREA
    ────────────────────────────────────────────── */
    #d-area {
      position: absolute; top: 28px; left: 0; right: 0; bottom: 70px;
      overflow-y: auto; overflow-x: hidden;
      padding: 24px 24px 16px;
      z-index: 1;
    }

    /* ──────────────────────────────────────────────
       CATEGORY SECTION
    ────────────────────────────────────────────── */
    .d-section { margin-bottom: 26px; }

    .d-cat-label {
      font-family: var(--mono); font-size: 9px; font-weight: 600;
      letter-spacing: 0.15em; text-transform: uppercase; color: var(--txt3);
      margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
    }
    .d-cat-label::before {
      content: ''; display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: currentColor; opacity: 0.7; flex-shrink: 0;
    }
    .d-cat-label::after {
      content: ''; flex: 1; height: 1px; background: var(--bd);
    }

    .d-icon-grid { display: flex; flex-wrap: wrap; gap: 18px 14px; }

    /* ──────────────────────────────────────────────
       DESKTOP ICON
    ────────────────────────────────────────────── */
    .d-icon {
      display: flex; flex-direction: column; align-items: center; gap: 7px;
      cursor: pointer; width: 72px; position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    .d-icon-img {
      width: 62px; height: 62px; border-radius: 15px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; position: relative;
      border: 1px solid rgba(255,255,255,0.09);
      transition: transform 0.22s var(--ease-spring), box-shadow 0.22s ease, filter 0.15s;
      will-change: transform;
    }
    .d-icon:hover .d-icon-img {
      transform: scale(1.10) translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    }
    .d-icon:active .d-icon-img { transform: scale(0.94); transition-duration: 0.1s; }

    .d-icon-name {
      font-size: 10.5px; font-weight: 500; color: var(--txt2); text-align: center;
      line-height: 1.25; max-width: 72px; transition: color 0.15s;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }
    .d-icon:hover .d-icon-name { color: var(--txt); }

    /* open indicator dot */
    .d-icon-open-dot {
      position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px; border-radius: 50%; background: var(--blue);
      opacity: 0; transition: opacity 0.2s;
    }
    .d-icon.is-open .d-icon-open-dot { opacity: 1; }

    /* ──────────────────────────────────────────────
       DOCK
    ────────────────────────────────────────────── */
    #dock {
      position: absolute; bottom: 8px; left: 0; right: 0; z-index: 300;
      display: flex; align-items: flex-end; justify-content: center;
      pointer-events: none;
    }

    #dock-pill {
      display: flex; align-items: flex-end; gap: 4px;
      padding: 7px 12px 9px;
      background: rgba(255,255,255,0.042);
      backdrop-filter: blur(48px) saturate(200%); -webkit-backdrop-filter: blur(48px) saturate(200%);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      box-shadow: 0 4px 28px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
      pointer-events: all;
    }

    .dk-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      position: relative; cursor: pointer; user-select: none;
    }

    .dk-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
      transition: transform 0.22s var(--ease-spring);
      position: relative; z-index: 1;
    }
    .dk-item:hover .dk-icon       { transform: scale(1.28) translateY(-7px); }
    .dk-item:active .dk-icon      { transform: scale(1.05); transition-duration: 0.08s; }
    .dk-item:hover + .dk-item .dk-icon,
    .dk-item.prev-hover .dk-icon  { transform: scale(1.10) translateY(-3px); }

    .dk-tooltip {
      position: absolute; bottom: calc(100% + 14px); left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: rgba(0,0,0,0.82); backdrop-filter: blur(8px);
      border: 1px solid var(--bd2); border-radius: 7px;
      padding: 4px 9px; font-size: 11px; font-weight: 500; color: var(--txt);
      white-space: nowrap; pointer-events: none;
      opacity: 0; transition: opacity 0.15s, transform 0.15s;
    }
    .dk-item:hover .dk-tooltip { opacity: 1; transform: translateX(-50%) translateY(0); }

    .dk-dot {
      width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.25);
      transition: background 0.2s; margin-top: 0;
    }
    .dk-item.open .dk-dot { background: rgba(255,255,255,0.7); }

    .dk-sep { width: 1px; height: 34px; background: rgba(255,255,255,0.1); margin: 0 4px; align-self: center; }

    /* ──────────────────────────────────────────────
       WINDOW MANAGER LAYER
    ────────────────────────────────────────────── */
    #wm {
      position: absolute; inset: 28px 0 70px 0;
      pointer-events: none; z-index: 100;
      overflow: visible;
    }

    /* ──────────────────────────────────────────────
       WINDOW
    ────────────────────────────────────────────── */
    .win {
      position: absolute; display: flex; flex-direction: column;
      background: var(--surf); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; overflow: hidden;
      box-shadow: var(--shadow);
      min-width: 280px; min-height: 160px;
      pointer-events: all;
      will-change: transform;
      backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
    }

    .win.anim-open  { animation: w-open  0.22s var(--ease-out) forwards; }
    .win.anim-close { animation: w-close 0.17s ease            forwards; }

    @keyframes w-open  { from { opacity:0; transform:scale(0.93) } to { opacity:1; transform:scale(1) } }
    @keyframes w-close { from { opacity:1; transform:scale(1)    } to { opacity:0; transform:scale(0.93) } }

    .win.inactive { box-shadow: var(--shadow-sm); }
    .win.inactive .win-tb { background: rgba(255,255,255,0.015); }

    /* Title bar */
    .win-tb {
      height: 36px; flex-shrink: 0;
      display: flex; align-items: center; padding: 0 10px; gap: 8px;
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid var(--bd);
      cursor: move; user-select: none; -webkit-user-select: none;
    }

    .win-btns { display: flex; gap: 7px; flex-shrink: 0; }
    .win-btn  { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; transition: filter 0.15s; flex-shrink: 0; }
    .win-btn:hover { filter: brightness(1.25); }
    .win-btn-x { background: var(--red); }
    .win-btn-m { background: var(--yellow); }
    .win-btn-f { background: var(--limegreen); }

    .win-title { flex: 1; text-align: center; font-size: 12px; font-weight: 600; color: var(--txt2); pointer-events: none; }
    .win-tb-end { width: 42px; flex-shrink: 0; } /* balance the buttons */

    /* Window body */
    .win-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

    /* ──────────────────────────────────────────────
       PROJECT WINDOW CONTENT
    ────────────────────────────────────────────── */
    .pw-media {
      width: 100%; aspect-ratio: 16/9; flex-shrink: 0; background: #000; position: relative; overflow: hidden;
    }
    .pw-media img  { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    .pw-media video{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }

    /* accent stripe at top of media */
    .pw-media::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; z-index: 3;
      background: var(--pw-accent, var(--blue));
      opacity: 0.7;
    }

    .pw-info { padding: 15px 17px 17px; overflow-y: auto; flex: 1; }

    .pw-cat { font-family: var(--mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em; color: var(--pw-accent, var(--blue)); margin-bottom: 3px; }
    .pw-name { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; line-height: 1.2; }
    .pw-desc { font-size: 13px; line-height: 1.68; color: var(--txt2); margin-bottom: 12px; }

    .pw-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
    .pw-tag  { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border: 1px solid var(--bd2); border-radius: 4px; color: var(--txt3); }

    .pw-open {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
      background: var(--pw-accent, var(--blue)); color: #fff; border: none; cursor: pointer;
      transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .pw-open:hover { opacity: 0.88; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.35); }
    .pw-open:active { transform: translateY(0); }

    /* ──────────────────────────────────────────────
       ABOUT WINDOW
    ────────────────────────────────────────────── */
    .aw-body { padding: 22px; overflow-y: auto; flex: 1; }

    .aw-hero { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }

    .aw-avatar {
      width: 68px; height: 68px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #0a2864, #7700cc);
      display: flex; align-items: center; justify-content: center; font-size: 28px;
      border: 2px solid rgba(255,255,255,0.1);
      box-shadow: 0 0 32px rgba(100,0,200,0.25);
    }

    .aw-name { font-size: 21px; font-weight: 700; letter-spacing: -0.025em; margin-bottom: 3px; }
    .aw-role { font-family: var(--mono); font-size: 10px; color: var(--blue); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
    .aw-loc  { font-size: 12px; color: var(--txt3); display: flex; align-items: center; gap: 4px; }

    .aw-bio { font-size: 13px; line-height: 1.72; color: var(--txt2); margin-bottom: 18px; }

    .aw-h2 {
      font-family: var(--mono); font-size: 9px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.13em; color: var(--txt3); margin-bottom: 10px;
    }

    .aw-skills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 18px; }
    .aw-skill {
      background: var(--surf2); border: 1px solid var(--bd); border-radius: 6px;
      padding: 6px 8px; font-size: 11.5px; font-weight: 500; text-align: center; color: var(--txt2);
    }

    .aw-work { font-size: 12px; color: var(--txt2); line-height: 1.8; margin-bottom: 18px; }

    .aw-links { display: flex; gap: 7px; flex-wrap: wrap; }
    .aw-link {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px;
      background: var(--surf2); border: 1px solid var(--bd2); border-radius: 8px;
      font-size: 12px; font-weight: 500; color: var(--txt); cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .aw-link:hover { border-color: var(--blue); color: var(--blue); }

    /* ──────────────────────────────────────────────
       TERMINAL WINDOW
    ────────────────────────────────────────────── */
    .tw-out {
      flex: 1; overflow-y: auto; padding: 12px 14px;
      background: #020209; font-family: var(--mono); font-size: 12px; line-height: 1.75; color: #a8a8c8;
    }
    .tw-out .t-prompt { color: var(--green); }
    .tw-out .t-cmd    { color: #e8e8f8; }
    .tw-out .t-hi     { color: var(--blue); }
    .tw-out .t-bold   { color: #fff; font-weight: 600; }
    .tw-out .t-muted  { color: rgba(168,168,200,0.45); }
    .tw-out .t-err    { color: #ff7070; }
    .tw-out .t-dim    { color: rgba(168,168,200,0.35); }

    .tw-input-row {
      display: flex; align-items: center; gap: 7px; padding: 7px 14px;
      background: #020209; border-top: 1px solid rgba(255,255,255,0.05); flex-shrink: 0;
    }
    .tw-ps1 { font-family: var(--mono); font-size: 12px; color: var(--green); white-space: nowrap; flex-shrink: 0; }
    .tw-inp {
      flex: 1; background: none; border: none; outline: none;
      font-family: var(--mono); font-size: 12px; color: #e8e8f8; caret-color: var(--green);
    }

    /* ──────────────────────────────────────────────
       CONTACT WINDOW
    ────────────────────────────────────────────── */
    .cw-body { padding: 22px; overflow-y: auto; flex: 1; }
    .cw-lead { font-size: 14px; line-height: 1.65; color: var(--txt2); margin-bottom: 18px; }
    .cw-list { display: flex; flex-direction: column; gap: 9px; }
    .cw-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      background: var(--surf2); border: 1px solid var(--bd); border-radius: 10px;
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .cw-item:hover { border-color: var(--blue); background: var(--blue-dim); }
    .cw-ico  { font-size: 17px; flex-shrink: 0; }
    .cw-text { flex: 1; }
    .cw-lbl  { font-size: 12.5px; font-weight: 600; margin-bottom: 1px; }
    .cw-val  { font-size: 11px; color: var(--txt3); font-family: var(--mono); }
    .cw-arr  { color: var(--txt3); font-size: 13px; }

    /* ──────────────────────────────────────────────
       MOBILE OVERLAY (for mobile: windows become sheets)
    ────────────────────────────────────────────── */
    #mob-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      display: none; align-items: flex-end; justify-content: center;
      padding: 12px;
    }
    #mob-overlay.on { display: flex; }

    #mob-sheet {
      width: 100%; max-width: 520px; max-height: 86vh;
      background: var(--surf); border: 1px solid var(--bd2); border-radius: 16px;
      display: flex; flex-direction: column; overflow: hidden;
      animation: sheet-up 0.3s var(--ease-out);
    }
    @keyframes sheet-up {
      from { transform: translateY(60px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .mob-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--bd2); margin: 10px auto 0; flex-shrink: 0; }
    #mob-content { flex: 1; overflow-y: auto; overflow-x: hidden; }

    /* ──────────────────────────────────────────────
       RESIZE HANDLE
    ────────────────────────────────────────────── */
    .win-resize {
      position: absolute; bottom: 0; right: 0;
      width: 16px; height: 16px; cursor: se-resize; z-index: 10;
      opacity: 0; transition: opacity 0.15s;
    }
    .win:hover .win-resize { opacity: 0.4; }
    .win-resize::before {
      content: '';
      position: absolute; bottom: 4px; right: 4px;
      width: 6px; height: 6px;
      border-right: 2px solid rgba(255,255,255,0.5);
      border-bottom: 2px solid rgba(255,255,255,0.5);
    }

    /* ──────────────────────────────────────────────

  const mi = Math.min(BOOT_MSGS.length - 1, Math.floor((bootPct / 100) * BOOT_MSGS.length));
  if (mi !== bootMI) { bootMI = mi; bootMsg.textContent = BOOT_MSGS[mi]; }
  if (bootPct < 100) { setTimeout(bootTick, 90 + Math.random() * 90); return; }

    bootEl.classList.add('out');

  }, 550);
}

/* ══════════════════════════════════════════════════
   CANVAS BACKGROUND — particle network
══════════════════════════════════════════════════ */
function initCanvas() {
  const cv = document.getElementById('bg-canvas');
  const cx = cv.getContext('2d');
  let W, H, pts, mx = -999, my = -999;

  function resize() {
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
    makePts();
  }

  function makePts() {
    const n = Math.max(40, Math.floor(W * H / 16000));
    pts = Array.from({length: n}, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.18,
      vy: (Math.random() - 0.5) * 0.18,
      r: Math.random() * 1.4 + 0.4,
    }));
  }

  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

  const LINK_DIST = 130, MOUSE_DIST = 160;

  function frame() {
    cx.clearRect(0, 0, W, H);
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      cx.fillStyle = 'rgba(80,130,255,0.2)'; cx.fill();
    }
    /* links */
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
        const d = Math.hypot(dx, dy);
        if (d < LINK_DIST) {
          const a = (1 - d / LINK_DIST) * 0.065;
          cx.beginPath(); cx.moveTo(pts[i].x, pts[i].y); cx.lineTo(pts[j].x, pts[j].y);
          cx.strokeStyle = `rgba(60,110,255,${a})`; cx.lineWidth = 0.7; cx.stroke();
        }
      }
      /* mouse repel */
      const dxm = pts[i].x - mx, dym = pts[i].y - my;
      const dm = Math.hypot(dxm, dym);
      if (dm < MOUSE_DIST) {
        const f = (1 - dm / MOUSE_DIST) * 0.012;
        pts[i].vx += dxm * f; pts[i].vy += dym * f;
        const sp = Math.hypot(pts[i].vx, pts[i].vy);
        if (sp > 1.2) { pts[i].vx = pts[i].vx / sp * 1.2; pts[i].vy = pts[i].vy / sp * 1.2; }
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
}

/* ══════════════════════════════════════════════════
   WINDOW MANAGER
══════════════════════════════════════════════════ */
let zTop = 10;
const openWins = {}; // id → { el, minimised }
const wmEl = document.getElementById('wm');

const isMobile = () => window.innerWidth < 500;

function bringFront(el) { el.style.zIndex = ++zTop; markInactive(); el.classList.remove('inactive'); }
function markInactive() { document.querySelectorAll('.win').forEach(w => w.classList.add('inactive')); }

function makeWin({ id, title, w = 500, h = 480, content }) {
  // If already open, just focus
  if (openWins[id]) {
    const wn = openWins[id];
    if (wn.minimised) { wn.el.style.display = ''; wn.minimised = false; }
    bringFront(wn.el);
    updateDockDots(); updateIconDots();
    return wn.el;
  }

  const el = document.createElement('div');
  el.className = 'win anim-open';

  // Size + position (cascade)
  el.style.width  = w + 'px';
  el.style.height = h + 'px';
  const offs = Object.keys(openWins).length;
  const lw = wmEl.offsetWidth  || window.innerWidth;
  const lh = wmEl.offsetHeight || (window.innerHeight - 100);
  const cx = Math.max(20, (lw - w) / 2 + offs * 26);
  const cy = Math.max(10, (lh - h) / 2 + (offs % 3) * 26);
  el.style.left = cx + 'px';
  el.style.top  = cy + 'px';

  el.innerHTML = `
    <div class="win-tb">
      <div class="win-btns">
        <button class="win-btn win-btn-x" title="Close"></button>
        <button class="win-btn win-btn-m" title="Minimise"></button>
        <button class="win-btn win-btn-f" title="Fullscreen"></button>
      </div>
      <div class="win-title">${title}</div>
      <div class="win-tb-end"></div>
    </div>
    <div class="win-body">${content}</div>
    <div class="win-resize"></div>`;

  wmEl.appendChild(el);
  bringFront(el);
  el.addEventListener('mousedown', () => bringFront(el));

  // Buttons
  el.querySelector('.win-btn-x').addEventListener('click', e => { e.stopPropagation(); closeWin(id); });
  el.querySelector('.win-btn-m').addEventListener('click', e => {
    e.stopPropagation();
    el.style.display = 'none';
    openWins[id].minimised = true;
    updateDockDots(); updateIconDots();
  });
  el.querySelector('.win-btn-f').addEventListener('click', e => {
    e.stopPropagation();
    if (el.dataset.full === '1') {
      el.style.cssText = `${el.dataset.prev} z-index:${el.style.zIndex}`;
      el.dataset.full = '';
    } else {
      el.dataset.prev = `left:${el.style.left};top:${el.style.top};width:${el.style.width};height:${el.style.height};`;
      el.dataset.full = '1';
      el.style.left = '0'; el.style.top = '0';
      el.style.width = wmEl.offsetWidth + 'px';
      el.style.height = wmEl.offsetHeight + 'px';
    }
  });

  makeDraggable(el, el.querySelector('.win-tb'));
  makeResizable(el, el.querySelector('.win-resize'));

  // Start any video
  const vid = el.querySelector('video');
  if (vid) { vid.muted = true; vid.loop = true; vid.playsInline = true; vid.play().catch(() => {}); }

  openWins[id] = { el, minimised: false };
  updateDockDots(); updateIconDots();
  return el;
}

function closeWin(id) {
  const wn = openWins[id];
  if (!wn) return;
  const vid = wn.el.querySelector('video');
  if (vid) vid.pause();
  wn.el.classList.add('anim-close');
  setTimeout(() => { wn.el.remove(); delete openWins[id]; updateDockDots(); updateIconDots(); }, 170);
}

function makeResizable(win, handle) {
  if (!handle) return;
  let on = false, sx, sy, sw, sh;
  handle.addEventListener('mousedown', e => {
    on = true; sx = e.clientX; sy = e.clientY;
    sw = parseInt(win.style.width); sh = parseInt(win.style.height);
    e.preventDefault(); e.stopPropagation();
  });
  document.addEventListener('mousemove', e => {
    if (!on) return;
    win.style.width  = Math.max(300, sw + e.clientX - sx) + 'px';
    win.style.height = Math.max(200, sh + e.clientY - sy) + 'px';
  });
  document.addEventListener('mouseup', () => { on = false; });
}

function makeDraggable(win, handle) {
  let ox, oy, sx, sy, on = false;
  handle.addEventListener('mousedown', e => {
    if (e.target.classList.contains('win-btn')) return;
    on = true; sx = e.clientX; sy = e.clientY;
    ox = parseInt(win.style.left) || 0; oy = parseInt(win.style.top) || 0;
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!on) return;
    let nx = ox + e.clientX - sx, ny = oy + e.clientY - sy;
    ny = Math.max(-28, ny);
    win.style.left = nx + 'px'; win.style.top = ny + 'px';
  });
  document.addEventListener('mouseup', () => { on = false; });
}

══════════════════════════════════════════════════ */
const HELP_TEXT = `<span class="t-bold">JHOS Terminal</span> — available commands

  <span class="t-hi">help</span>        show this message
  <span class="t-hi">about</span>       display bio
  <span class="t-hi">ls</span>          list all projects

`;

const ABOUT_TEXT = `<span class="t-bold">Jimi Hughes</span> — Creator / AI Engineer
<span class="t-dim">─────────────────────────────</span>

Focus:     full-stack · AI integration · automation
Interests: investing · films · content creation

function lsProjects() {
  return PROJECTS.map(p =>
    `  <span class="t-hi">${p.id.padEnd(16)}</span><span class="t-dim">${p.title.padEnd(20)}</span> <span style="color:${p.accent}80">${p.cat}</span>`
  ).join('\n');
}

function termCmd(outEl, raw) {
  const cmd = raw.trim();
  outEl.innerHTML += `\n<span class="t-prompt">jimi@jhos:~$</span> <span class="t-cmd">${escHtml(cmd)}</span>\n`;

  const parts = cmd.split(/\s+/);
  let res = '';
  switch (parts[0].toLowerCase()) {
    case 'help':    res = HELP_TEXT; break;
    case 'about':   res = ABOUT_TEXT; break;
    case 'skills':  res = SKILLS_TEXT; break;
    case 'contact': res = CONTACT_TEXT; break;
    case 'whoami':  res = 'jimi hughes'; break;
    case 'date':    res = new Date().toLocaleString(); break;
    case 'clear':   outEl.innerHTML = ''; return;
    case 'ls':      res = lsProjects(); break;
    case 'open': {
      const id = parts[1];
      if (!id) { res = '<span class="t-err">Usage: open &lt;project-id&gt;</span>'; break; }
      const p = PROJECTS.find(x => x.id === id);
      if (!p) { res = `<span class="t-err">Not found: ${escHtml(id)}</span>. Try <span class="t-hi">ls</span>`; break; }
      openProject(p);
      res = `<span class="t-hi">Opening ${p.title}…</span>`;
      break;
    }
    default: res = cmd ? `<span class="t-err">command not found: ${escHtml(cmd)}</span>` : '';
  }
  if (res) outEl.innerHTML += `<span>${res}</span>\n`;
  outEl.scrollTop = outEl.scrollHeight;
}

function openTerminal() {
  const content = `
    <div class="tw-out" id="tw-out">
<span class="t-dim">JHOS Terminal v1.0</span>
Type <span class="t-hi">help</span> for available commands.
</div>
    <div class="tw-input-row">
      <span class="tw-ps1">jimi@jhos:~$</span>
      <input class="tw-inp" id="tw-inp" type="text" autocomplete="off" spellcheck="false">
    </div>`;

  if (isMobile()) { openMobSheet(content); } else { makeWin({ id:'terminal', title:'Terminal', w:540, h:380, content }); }

  setTimeout(() => {
    const inp = document.getElementById('tw-inp');
    if (!inp) return;
    inp.focus();
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const out = document.getElementById('tw-out');
      if (out) termCmd(out, inp.value);
      inp.value = '';
    });
  }, 80);
}

/* ══════════════════════════════════════════════════
   DESKTOP ICONS
══════════════════════════════════════════════════ */
function buildDesktop() {
  const area = document.getElementById('d-area');
  SECTIONS.forEach(sec => {
    const projs = PROJECTS.filter(p => p.sec === sec.id);
    if (!projs.length) return;

    const sect = document.createElement('div');
    sect.className = 'd-section';

    const label = document.createElement('div');
    label.className = 'd-cat-label';
    label.style.color = sec.accent + 'aa';
    label.textContent = sec.label;
    sect.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'd-icon-grid';

    projs.forEach(p => {
      const icon = document.createElement('div');
      icon.className = 'd-icon';
      icon.dataset.projId = p.id;
      icon.innerHTML = `
        <div class="d-icon-img" style="background:linear-gradient(145deg,${p.bg[0]},${p.bg[1]})">
          <span>${p.emoji}</span>
        </div>
        <span class="d-icon-name">${p.title}</span>
        <div class="d-icon-open-dot"></div>`;
      icon.addEventListener('click', () => openProject(p));
      grid.appendChild(icon);
    });

    sect.appendChild(grid);
    area.appendChild(sect);
  });
}

function updateIconDots() {
  document.querySelectorAll('.d-icon').forEach(ico => {
    const id = ico.dataset.projId;
    const wn = openWins[id];
    ico.classList.toggle('is-open', !!(wn && !wn.minimised));
  });
}

/* ══════════════════════════════════════════════════
   DOCK
══════════════════════════════════════════════════ */
const DOCK_DEF = [
  { id:'about',    emoji:'👤', label:'About',    bg:'linear-gradient(145deg,#0a2064,#1a6cff)', action: openAbout    },
  { id:'terminal', emoji:'⌨', label:'Terminal', bg:'linear-gradient(145deg,#020a0a,#006644)', action: openTerminal },
  { id:'contact',  emoji:'✉', label:'Contact',  bg:'linear-gradient(145deg,#1a0028,#8800cc)', action: openContact  },
  { sep:true },
  { id:'github',   emoji:'🐙', label:'GitHub',   bg:'rgba(255,255,255,0.06)',
    action: () => window.open('https://github.com/JimiHughes','_blank','noopener') },
  { id:'linkedin', emoji:'🔗', label:'LinkedIn', bg:'rgba(0,40,100,0.5)',
    action: () => window.open('https://www.linkedin.com/in/jimi-hughes-a0b33737b','_blank','noopener') },
];

function buildDock() {
  const pill = document.getElementById('dock-pill');
  DOCK_DEF.forEach(d => {
    if (d.sep) {
      const s = document.createElement('div'); s.className = 'dk-sep'; pill.appendChild(s); return;
    }
    const el = document.createElement('div');
    el.className = 'dk-item'; el.dataset.dockId = d.id;
    el.innerHTML = `
      <div class="dk-icon" style="background:${d.bg}">${d.emoji}</div>
      <div class="dk-tooltip">${d.label}</div>
      <div class="dk-dot"></div>`;
    el.addEventListener('click', () => {
      const wn = openWins[d.id];
      if (wn && wn.minimised) {
        wn.el.style.display = ''; wn.minimised = false;
        bringFront(wn.el); updateDockDots(); updateIconDots();
      } else { d.action(); }
    });
    pill.appendChild(el);
  });
}

function updateDockDots() {
  document.querySelectorAll('.dk-item').forEach(el => {
    const id = el.dataset.dockId;
    const wn = openWins[id];
    el.classList.toggle('open', !!(wn && !wn.minimised));
  });
}

/* ══════════════════════════════════════════════════
   STAGGER ICONS IN
══════════════════════════════════════════════════ */
function staggerIcons() {
  const icons = document.querySelectorAll('.d-icon');
  icons.forEach((ic, i) => {
    ic.style.opacity = '0';
    ic.style.transform = 'translateY(14px) scale(0.92)';
    ic.style.transition = `opacity 0.4s ease ${i * 28}ms, transform 0.4s var(--ease-out) ${i * 28}ms`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      ic.style.opacity = '1';
      ic.style.transform = 'translateY(0) scale(1)';
    }));
  });
}

/* ══════════════════════════════════════════════════
   UTIL
══════════════════════════════════════════════════ */
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ══════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════ */
let _desktopReady = false;
function initDesktop() {
  if (_desktopReady) return;
  _desktopReady = true;
  initCanvas();
  buildDesktop();
  buildDock();
  staggerIcons();
  // Auto-open About after icons settle
  if (!isMobile()) setTimeout(openAbout, 900);
}
