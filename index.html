    /* ── Reset ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #080808;
      color: #fff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* hide scrollbars globally */
    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { display: none; }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 56px;
      backdrop-filter: blur(52px) saturate(240%);
      -webkit-backdrop-filter: blur(52px) saturate(240%);
      background: rgba(6,6,6,0.5);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .nav-left { display: flex; align-items: center; gap: 10px; }

    /* Per-letter bounce name */
    .nav-name {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .nav-name-letters { display: inline-flex; }

    .nav-name-letters span {
      display: inline-block;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      font-family: 'Courier New', monospace;
      width: 0.6em;
      text-align: center;
      color: rgba(255,255,255,0.9);
      transform: translateY(0);
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), color 0.15s ease;
    }

    .nav-name:hover .nav-name-letters span {
      transform: translateY(-5px);
      color: #fff;
    }

    .nav-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      font-family: 'Courier New', monospace;
      letter-spacing: -0.01em;
    }

    /* Nav links — clip-path blue reveal */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
      font-family: 'Courier New', monospace;
    }

    .nav-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      font-size: 13px;
      text-decoration: none;
      color: rgba(255,255,255,0.6);
      transition: color 0.15s ease;
      user-select: none;
      border-radius: 6px;
    }

    .nav-link-bg {
      position: absolute;
      inset: 0;
      border-radius: 6px;
      background: #0066ff;
      opacity: 0.18;
      clip-path: inset(100% 0 0 0 round 6px);
      transition: clip-path 0.15s ease;
      pointer-events: none;
    }

    .nav-link:hover { color: #fff; }
    .nav-link:hover .nav-link-bg { clip-path: inset(0% 0 0 0 round 6px); }
    .nav-link > span { position: relative; z-index: 1; }

    /* Dark/light toggle pill */
    .toggle-pill {
      width: 36px; height: 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      position: relative;
      background: #0066ff;
      margin-left: 6px;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .toggle-pill-dot {
      position: absolute;
      top: 3px; left: 3px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #080808;
      transition: left 0.3s cubic-bezier(0.22,1,0.36,1), background 0.3s;
    }

    /* ── TOGGLE LIST BUTTON ── */
    #toggle-list-btn {
      position: fixed;
      top: 64px; right: 20px;
      z-index: 100;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.75);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.01em;
      opacity: 0.55;
      transition: opacity 0.2s, background 0.2s;
    }
    #toggle-list-btn:hover { opacity: 1; background: rgba(255,255,255,0.1); }

    /* ── STACKED CARD AREA ── */
    #card-area {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding-top: 56px;
      transition: opacity 0.4s ease;
    }

    .card {
      position: absolute;
      width: min(680px, 84vw);
      border: 1px solid rgba(255,255,255,0.07);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition:
        transform 0.65s cubic-bezier(0.22,1,0.36,1),
        opacity   0.45s ease,
        border-radius 0.65s cubic-bezier(0.22,1,0.36,1);
      transform-origin: center center;
    }

    /* Card position states */
    .card[data-pos="0"] { transform: translateY(0)    scale(1);     z-index:10; opacity:1;   cursor:default;  border-radius:0; }
    .card[data-pos="1"] { transform: translateY(18vh) scale(0.925); z-index:9;  opacity:1;   cursor:pointer;  border-radius:0; }
    .card[data-pos="2"] { transform: translateY(36vh) scale(0.85);  z-index:8;  opacity:1;   cursor:pointer;  border-radius:0; }
    .card[data-pos="3"] { transform: translateY(54vh) scale(0.775); z-index:7;  opacity:1;   cursor:pointer;  border-radius:0; }
    .card[data-pos="4"] { transform: translateY(72vh) scale(0.7);   z-index:6;  opacity:0.5; cursor:pointer;  border-radius:0; }
    .card[data-pos="above"] { transform: translateY(-110vh) scale(1);   z-index:5;  opacity:0;   pointer-events:none; }
    .card[data-pos="below"] { transform: translateY(110vh)  scale(0.7); z-index:5;  opacity:0;   pointer-events:none; }

    /* Card media (image + future video slot) */
    .card-media {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      flex-shrink: 0;
      background: #111;
      overflow: hidden;
    }

    /* Fallback image */
    .card-media img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease, opacity 0.5s ease;
      z-index: 1;
    }

    /* Video slot — hidden until a src is set */
    .card-media video {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    /* When video is ready, fade it over the image */
    .card-media video.loaded {
      opacity: 1;
    }

    /* Label overlay — bottom-left */
    .card-label {
      position: absolute;
      bottom: 12px; left: 12px;
      z-index: 5;
      background: rgba(0,0,0,0.52);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 6px 10px;
      transition: opacity 0.25s ease;
    }

    .card-label h2 {
      font-size: 1rem;
      font-weight: 600;
      color: rgba(255,255,255,0.92);
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 2px;
    }

    .card-label p {
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      font-family: 'Courier New', monospace;
    }

    /* Dim labels on non-active cards */
    .card[data-pos="1"] .card-label { opacity: 0.45; }
    .card[data-pos="2"] .card-label { opacity: 0.18; }
    .card[data-pos="3"] .card-label { opacity: 0.08; }
    .card[data-pos="4"] .card-label,
    .card[data-pos="above"] .card-label,
    .card[data-pos="below"] .card-label { opacity: 0; }

    /* Hover scale only on active card */
    .card[data-pos="0"]:hover .card-media img { transform: scale(1.03); }

    /* ── RIGHT DESCRIPTION PANEL ── */
    #desc-panel {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      /* sits just to the right of the card — card is min(680px,84vw) wide centered */
      left: calc(50% + min(340px, 42vw) + 24px);
      width: 190px;
      z-index: 50;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    #desc-panel-text {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      line-height: 1.75;
      margin-bottom: 14px;
    }

    #desc-panel-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .desc-tag {
      font-size: 9px;
      padding: 2px 7px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 3px;
      color: rgba(255,255,255,0.4);
      font-family: 'Courier New', monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── PROGRESS DOTS ── */
    #progress-dots {
      position: fixed;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 7px;
      z-index: 50;
      transition: opacity 0.35s;
    }

    .dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      cursor: pointer;
      transition: background 0.25s, transform 0.25s;
      flex-shrink: 0;
    }

    .dot.active {
      background: #0066ff;
      transform: scale(1.5);
    }

    /* ── NAV HINT ── */
    #nav-hint {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.22);
      letter-spacing: 0.08em;
      z-index: 50;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.35s;
    }

    /* ── LIST VIEW ── */
    #list-view {
      display: none;
      position: fixed;
      inset: 0;
      padding-top: 56px;
      overflow-y: auto;
      background: #080808;
    }

    #list-view.visible { display: block; }

    .list-inner {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 24px 80px;
    }

    .list-row {
      display: grid;
      grid-template-columns: 80px 1fr auto auto;
      align-items: center;
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      text-decoration: none;
      color: inherit;
      transition: background 0.12s;
      border-radius: 4px;
    }

    .list-row:hover { background: rgba(255,255,255,0.04); }

    .list-thumb {
      width: 80px; height: 50px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    .list-thumb img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }

    .list-thumb-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      background: #0d0d14;
    }

    .list-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .list-desc  { font-size: 11px; color: rgba(255,255,255,0.38); margin-top: 2px; }

    .list-tag {
      font-family: 'Courier New', monospace;
      font-size: 9px;
      color: rgba(255,255,255,0.32);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .list-arrow { color: #0066ff; font-size: 14px; opacity: 0; transition: opacity 0.12s; }
    .list-row:hover .list-arrow { opacity: 1; }

    /* ── FOOTER (list view only) ── */
    .list-footer {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .list-footer-note {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.25);
    }

    .list-footer-links { display: flex; gap: 16px; }
    .list-footer-links a {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      text-decoration: none;
      transition: color 0.15s;
    }
    .list-footer-links a:hover { color: #fff; }
  </style>
</head>

        // Special JDI card with gradient bg and SVG logo
        media.style.cssText = 'background:linear-gradient(135deg,#0d0d14 0%,#1a1000 100%);display:flex;align-items:center;justify-content:center;';
        media.innerHTML = `<svg viewBox="0 0 120 120" width="90" xmlns="http://www.w3.org/2000/svg" style="position:relative;z-index:1"><rect width="120" height="120" rx="26" fill="#0d0d14"/><path d="M68 18L32 66h32L52 102l50-54H68z" fill="#ff6b35"/></svg>`;
      } else {
        // Image (shown always)
        if (p.img) {
          const img = document.createElement('img');
          img.src = p.img;
          img.alt = p.title;
          img.loading = i === 0 ? 'eager' : 'lazy';
          media.appendChild(img);
        }

        // Video slot (hidden until video.src is set and loaded)
        // To add a video later: set video.src = 'videos/yourfile.mp4'
        // The video will fade in over the screenshot automatically
        const vid = document.createElement('video');
        vid.autoplay = true;
        vid.loop = true;
        vid.muted = true;
        vid.playsInline = true;
        vid.setAttribute('playsinline', '');
        if (p.video) {
          vid.src = p.video;
          vid.addEventListener('loadeddata', () => vid.classList.add('loaded'));
        }
        media.appendChild(vid);
      }

      // Label overlay
      const label = document.createElement('div');
      label.className = 'card-label';
      label.innerHTML = `<h2>${p.title}</h2><p>${p.cat}</p>`;
      media.appendChild(label);

      card.appendChild(media);

      // Click: non-active cards advance; active card opens the link
      card.addEventListener('click', () => {
        if (parseInt(card.dataset.pos) !== 0) {
          goTo(i);
        } else {
          if (p.external) window.open(p.href, '_blank', 'noopener');
          else window.location.href = p.href;
        }
      });

      cardArea.appendChild(card);
      return card;
    });

    // ─────────────────────────────────────────
    // Position update
    // ─────────────────────────────────────────
    function updatePositions() {
      const n = projects.length;
      cardEls.forEach((card, i) => {
        const offset = ((i - current) % n + n) % n;
        let pos;
        if (offset === 0)        pos = '0';
        else if (offset === 1)   pos = '1';
        else if (offset === 2)   pos = '2';
        else if (offset === 3)   pos = '3';
        else if (offset === 4)   pos = '4';
        else if (offset >= n - 3) pos = 'above';
        else                     pos = 'below';
        card.dataset.pos = pos;
      });

      // Description panel
      const p = projects[current];
      descText.textContent = p.desc;
      descTags.innerHTML = p.tags.map(t => `<span class="desc-tag">${t}</span>`).join('');

      // Dots
      document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
    }

    function goTo(idx) {
      current = ((idx % projects.length) + projects.length) % projects.length;
      updatePositions();
    }

    function next() { goTo(current + 1); }
    function prev() { goTo(current - 1); }

    updatePositions();

    // ─────────────────────────────────────────
    // Input: wheel + arrow keys + touch swipe
    // ─────────────────────────────────────────
    let locked = false;
    function throttle(fn) {
      if (locked || listVisible) return;
      fn();
      locked = true;
      setTimeout(() => locked = false, 700);
    }

    window.addEventListener('wheel', e => {
      throttle(() => e.deltaY > 0 ? next() : prev());
    }, { passive: true });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') throttle(next);
      if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft')  throttle(prev);
    });

    // Touch swipe
    let touchY = null;
    window.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
    window.addEventListener('touchend', e => {
      if (touchY === null) return;
      const dy = touchY - e.changedTouches[0].clientY;
      if (Math.abs(dy) > 40) throttle(() => dy > 0 ? next() : prev());
      touchY = null;
    }, { passive: true });

    // ─────────────────────────────────────────
    // List view toggle
    // ─────────────────────────────────────────
    let listVisible = false;
    const listView   = document.getElementById('list-view');
    const listInner  = document.getElementById('list-inner');
    const toggleBtn  = document.getElementById('toggle-list-btn');
    const toggleLabel = document.getElementById('toggle-list-label');
    const descPanel  = document.getElementById('desc-panel');
    const progressEl = document.getElementById('progress-dots');
    const hintEl     = document.getElementById('nav-hint');

    // Build list rows
    projects.forEach(p => {
      const a = document.createElement('a');
      a.href = p.href;
      if (p.external) { a.target = '_blank'; a.rel = 'noopener'; }
      a.className = 'list-row';

      const thumbHtml = p.isJDI
        ? `<div class="list-thumb"><div class="list-thumb-placeholder">⚡</div></div>`
        : `<div class="list-thumb"><img src="${p.img}" alt="${p.title}" loading="lazy"></div>`;

      a.innerHTML = `
        ${thumbHtml}
        <div>
          <div class="list-title">${p.title}</div>
          <div class="list-desc">${p.desc.slice(0, 72)}…</div>
        </div>
        <div class="list-tag">${p.cat}</div>
        <div class="list-arrow">→</div>`;
      listInner.appendChild(a);
    });

    toggleBtn.addEventListener('click', () => {
      listVisible = !listVisible;
      listView.classList.toggle('visible', listVisible);
      cardArea.style.opacity = listVisible ? '0' : '1';
      cardArea.style.pointerEvents = listVisible ? 'none' : '';
      descPanel.style.opacity  = listVisible ? '0' : '1';
      progressEl.style.opacity = listVisible ? '0' : '1';
      hintEl.style.opacity     = listVisible ? '0' : '1';
      toggleLabel.textContent  = listVisible ? 'Back to cards' : 'Toggle list';
    });

    // ─────────────────────────────────────────
    // Theme toggle (dark/light)
    // ─────────────────────────────────────────
    let lightMode = false;
    const pillDot = document.getElementById('pill-dot');
    document.getElementById('theme-toggle').addEventListener('click', () => {
      lightMode = !lightMode;
      document.body.style.background    = lightMode ? '#f0ede8' : '#080808';
      document.body.style.color         = lightMode ? '#111'    : '#fff';
      document.getElementById('list-view').style.background = lightMode ? '#f0ede8' : '#080808';
      pillDot.style.left       = lightMode ? '19px' : '3px';
      pillDot.style.background = lightMode ? '#f0ede8' : '#080808';
    });

    // ─────────────────────────────────────────
    // Visitor counter (silent fail)
    // ─────────────────────────────────────────
    fetch('https://api.counterapi.dev/v1/jimihughes/portfolio/up')
      .then(r => r.json())
      .then(() => {})
      .catch(() => {});

    // ─────────────────────────────────────────
    // Console easter egg
    // ─────────────────────────────────────────
    console.log('%c👋 Hey, you found me!', 'font-size:18px;font-weight:bold;');
    console.log('%c📬 Want to work together? → jimifh0111@gmail.com', 'font-size:13px;color:#0066ff;font-weight:600;');
  </script>
