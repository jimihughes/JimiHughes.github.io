<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jimi Hughes — Creator / AI Engineer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="description" content="Portfolio of Jimi Hughes — creator and AI engineer building apps, games, and tools for the web.">
  <meta property="og:title" content="Jimi Hughes — Creator / AI Engineer">
  <meta property="og:description" content="Apps, games, and AI tools built for the web.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jimihughes.com">
  <meta property="og:image" content="https://jimihughes.com/images/og-cover.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
/* ═══════════════════════════════════════════════════
   RESET + ROOT
═══════════════════════════════════════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#06060f; color:#e2e2ee; font-family:'Space Grotesk',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
* { scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.1) transparent; }
*::-webkit-scrollbar { width:4px; height:4px; }
*::-webkit-scrollbar-track { background:transparent; }
*::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.12); border-radius:4px; }
a { text-decoration:none; color:inherit; }
button { font-family:inherit; cursor:pointer; }

:root {
  --bg:     #06060f;
  --surf:   rgba(10,10,22,0.96);
  --surf2:  rgba(18,18,36,0.85);
  --bd:     rgba(255,255,255,0.07);
  --bd2:    rgba(255,255,255,0.13);
  --txt:    #e4e4f0;
  --txt2:   rgba(228,228,240,0.52);
  --txt3:   rgba(228,228,240,0.28);
  --blue:   #1a6cff;
  --blue-d: rgba(26,108,255,0.18);
  --orange: #ff6b35;
  --purple: #9333ea;
  --green:  #10b981;
  --red:    #ff5f57;
  --yellow: #febc2e;
  --lime:   #28c840;
  --win-shadow: 0 32px 80px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.07);
  --win-shadow-focus: 0 32px 80px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.1), 0 0 48px rgba(26,108,255,0.1);
  --font: 'Space Grotesk',system-ui,sans-serif;
  --mono: 'JetBrains Mono','Courier New',monospace;
  --spring: cubic-bezier(0.34,1.56,0.64,1);
  --ease:   cubic-bezier(0.22,1,0.36,1);
}

/* ═══════════════════════════════════════════════════
   CURSOR GLOW
═══════════════════════════════════════════════════ */
#cursor-glow {
  position:fixed; width:380px; height:380px; border-radius:50%;
  background:radial-gradient(circle,rgba(26,108,255,0.055) 0%,transparent 70%);
  pointer-events:none; z-index:1; transform:translate(-50%,-50%);
  transition:left 0.08s,top 0.08s;
  will-change:left,top;
}

/* ═══════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════ */
#boot {
  position:fixed; inset:0; z-index:9999; background:#000;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:32px;
  transition:opacity 0.7s ease;
}
#boot.out { opacity:0; pointer-events:none; }

.boot-logo { display:flex; align-items:center; gap:16px; animation:fade-up 0.6s var(--ease) 0.2s both; }

@keyframes fade-up { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
@keyframes fade-in  { from{opacity:0} to{opacity:1} }

.boot-icon {
  width:56px; height:56px; border-radius:16px;
  background:linear-gradient(135deg,#0a2a80,#1a6cff);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 50px rgba(26,108,255,0.5),inset 0 1px 0 rgba(255,255,255,0.15);
}
.boot-icon svg { width:28px; height:28px; }
.boot-wm { font-family:var(--mono); font-size:30px; font-weight:600; letter-spacing:-0.02em; color:#fff; }
.boot-wm em { color:var(--blue); font-style:normal; }

.boot-bar-wrap { width:220px; height:2px; background:rgba(255,255,255,0.07); border-radius:2px; overflow:hidden; animation:fade-up 0.5s var(--ease) 0.4s both; }
#boot-bar { height:100%; width:0; background:var(--blue); border-radius:2px; box-shadow:0 0 16px var(--blue); transition:width 0.12s linear; }
#boot-msg { font-family:var(--mono); font-size:11px; color:rgba(255,255,255,0.28); letter-spacing:0.06em; min-height:1em; animation:fade-up 0.5s var(--ease) 0.5s both; }

/* ═══════════════════════════════════════════════════
   DESKTOP
═══════════════════════════════════════════════════ */
#desktop {
  position:fixed; inset:0; overflow:hidden;
  opacity:0; transition:opacity 0.7s ease;
  background:var(--bg);
}
#desktop.on { opacity:1; }

/* wallpaper gradient blobs */
#desktop::before {
  content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 80% 70% at 15% 55%,  rgba(0,60,210,0.08)  0%,transparent 65%),
    radial-gradient(ellipse 55% 80% at 85% 10%,  rgba(120,0,220,0.06) 0%,transparent 60%),
    radial-gradient(ellipse 65% 55% at 55% 95%,  rgba(0,120,230,0.05) 0%,transparent 55%),
    radial-gradient(ellipse 40% 40% at 80% 75%,  rgba(200,80,0,0.03)  0%,transparent 50%);
}

/* subtle dot grid */
#desktop::after {
  content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background-image:radial-gradient(circle,rgba(255,255,255,0.035) 1px,transparent 1px);
  background-size:30px 30px;
}

#bg-canvas { position:absolute; inset:0; z-index:0; pointer-events:none; }

/* ═══════════════════════════════════════════════════
   MENU BAR
═══════════════════════════════════════════════════ */
#menubar {
  position:absolute; top:0; left:0; right:0; height:28px; z-index:300;
  display:flex; align-items:center; justify-content:space-between; padding:0 14px;
  background:rgba(6,6,15,0.75);
  backdrop-filter:blur(52px) saturate(200%); -webkit-backdrop-filter:blur(52px) saturate(200%);
  border-bottom:1px solid rgba(255,255,255,0.06);
}
#mb-left  { display:flex; align-items:center; gap:2px; }
#mb-right { display:flex; align-items:center; gap:12px; }

.mb-logo { display:flex; align-items:center; gap:7px; margin-right:10px; }
.mb-logo-mark {
  width:17px; height:17px; border-radius:5px;
  background:linear-gradient(135deg,#0a2a80,#1a6cff);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 10px rgba(26,108,255,0.4);
}
.mb-logo-mark svg { width:10px; height:10px; }
.mb-logo-name { font-family:var(--mono); font-size:12px; font-weight:600; color:#fff; letter-spacing:-0.01em; }
.mb-logo-name em { color:var(--blue); font-style:normal; }

.mb-btn {
  font-size:12px; color:var(--txt2); padding:3px 9px; border-radius:5px; border:none; background:none;
  transition:color 0.2s; position:relative; cursor:pointer;
}
/* Progressive border that draws clockwise around the button on hover */
.mb-btn::before {
  content:''; position:absolute; inset:-1px; border-radius:5px; pointer-events:none;
  background:
    linear-gradient(var(--blue),var(--blue)) top    left  / 0%   1px no-repeat,
    linear-gradient(var(--blue),var(--blue)) top    right / 1px  0%  no-repeat,
    linear-gradient(var(--blue),var(--blue)) bottom right / 0%   1px no-repeat,
    linear-gradient(var(--blue),var(--blue)) bottom left  / 1px  0%  no-repeat;
  transition:background-size 0s;
  opacity:0;
}
.mb-btn:hover { color:#fff; }
.mb-btn:hover::before {
  opacity:1;
  background:
    linear-gradient(var(--blue),var(--blue)) top    left  / 100% 1px no-repeat,
    linear-gradient(var(--blue),var(--blue)) top    right / 1px  100% no-repeat,
    linear-gradient(var(--blue),var(--blue)) bottom right / 100% 1px no-repeat,
    linear-gradient(var(--blue),var(--blue)) bottom left  / 1px  100% no-repeat;
  transition:
    background-size 0.08s ease           0s,
    background-size 0.08s ease         0.08s,
    background-size 0.08s ease         0.16s,
    background-size 0.08s ease         0.24s;
}

#mb-clock { font-family:var(--mono); font-size:11px; color:var(--txt2); min-width:42px; text-align:right; letter-spacing:0.02em; }

/* ═══════════════════════════════════════════════════
   DESKTOP SCROLL AREA
═══════════════════════════════════════════════════ */
#d-area {
  position:absolute; top:28px; left:0; right:0; bottom:70px;
  overflow-y:auto; overflow-x:hidden;
  padding:24px 24px 16px; z-index:1;
}

/* ═══════════════════════════════════════════════════
   SECTION LABELS
═══════════════════════════════════════════════════ */
.d-section { margin-bottom:26px; }

.d-cat-label {
  font-family:var(--mono); font-size:9px; font-weight:600;
  letter-spacing:0.16em; text-transform:uppercase;
  margin-bottom:14px; display:flex; align-items:center; gap:10px;
  position:relative;
}
.d-cat-label-dot {
  width:6px; height:6px; border-radius:50%; flex-shrink:0;
  box-shadow:0 0 8px currentColor;
  animation:pulse-dot 2.4s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%,100% { transform:scale(1);   opacity:0.7; }
  50%      { transform:scale(1.5); opacity:1; }
}
.d-cat-label-text { position:relative; z-index:1; }
.d-cat-label-line { flex:1; height:1px; background:currentColor; opacity:0.15; }

/* ═══════════════════════════════════════════════════
   DESKTOP ICONS
═══════════════════════════════════════════════════ */
.d-icon-grid { display:flex; flex-wrap:wrap; gap:18px 14px; }

.d-icon {
  display:flex; flex-direction:column; align-items:center; gap:7px;
  cursor:pointer; width:74px; position:relative;
  -webkit-tap-highlight-color:transparent;
  transition:filter 0.2s;
}
.d-icon.dragging { opacity:0.35; filter:blur(1px); }
.d-icon.drop-target .d-icon-img {
  outline:2px dashed rgba(255,255,255,0.35);
  outline-offset:5px;
  animation:target-pulse 0.6s ease-in-out infinite alternate;
}
@keyframes target-pulse { to { outline-color:rgba(255,255,255,0.7); } }

.d-icon-img {
  width:64px; height:64px; border-radius:16px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:27px;
  border:1px solid rgba(255,255,255,0.09);
  transition:transform 0.22s var(--spring), box-shadow 0.22s ease, border-color 0.2s;
  will-change:transform;
  position:relative;
}
/* shimmer highlight on top edge */
.d-icon-img::before {
  content:''; position:absolute; top:0; left:15%; right:15%;
  height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);
  border-radius:1px;
}
.d-icon:hover .d-icon-img {
  transform:scale(1.12) translateY(-5px);
  box-shadow:0 14px 36px rgba(0,0,0,0.6), 0 0 28px var(--icon-glow,rgba(80,130,255,0.3));
  border-color:rgba(255,255,255,0.18);
}
.d-icon:active .d-icon-img { transform:scale(0.93); transition-duration:0.09s; }

.d-icon-name {
  font-size:11px; font-weight:500; color:var(--txt2); text-align:center;
  line-height:1.25; max-width:74px; transition:color 0.15s;
  text-shadow:0 1px 5px rgba(0,0,0,0.9);
}
.d-icon:hover .d-icon-name { color:var(--txt); }

.d-icon-open-dot {
  position:absolute; bottom:-5px; left:50%; transform:translateX(-50%);
  width:4px; height:4px; border-radius:50%; background:var(--blue);
  opacity:0; transition:opacity 0.2s;
  box-shadow:0 0 6px var(--blue);
}
.d-icon.is-open .d-icon-open-dot { opacity:1; }

/* ═══════════════════════════════════════════════════
   TASKBAR  (minimised window tabs)
═══════════════════════════════════════════════════ */
#taskbar {
  position:absolute; bottom:72px; left:50%; transform:translateX(-50%);
  display:flex; gap:6px; z-index:190; pointer-events:none; align-items:center;
  flex-wrap:nowrap; max-width:90vw;
}
.tb-item {
  display:flex; align-items:center; gap:7px; padding:5px 12px;
  background:rgba(12,12,26,0.9); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.1); border-radius:8px;
  cursor:pointer; pointer-events:all;
  font-size:11.5px; font-weight:500; color:var(--txt2); white-space:nowrap;
  transition:background 0.15s,color 0.15s,transform 0.15s;
  animation:tb-in 0.25s var(--ease);
}
.tb-item:hover { background:rgba(255,255,255,0.08); color:var(--txt); transform:translateY(-2px); }
.tb-item:active { transform:translateY(0); }
@keyframes tb-in {
  from { opacity:0; transform:translateY(12px) scale(0.9); }
  to   { opacity:1; transform:translateY(0)    scale(1); }
}
.tb-dot { width:6px; height:6px; border-radius:50%; background:var(--blue); box-shadow:0 0 6px var(--blue); flex-shrink:0; }
.tb-close {
  width:14px; height:14px; border-radius:3px; border:none; background:none;
  color:var(--txt3); font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:color 0.15s,background 0.15s; margin-left:2px; flex-shrink:0;
}
.tb-close:hover { color:var(--red); background:rgba(255,95,87,0.12); }

/* ═══════════════════════════════════════════════════
   DOCK
═══════════════════════════════════════════════════ */
#dock {
  position:absolute; bottom:8px; left:0; right:0; z-index:300;
  display:flex; align-items:flex-end; justify-content:center; pointer-events:none;
}
#dock-pill {
  display:flex; align-items:flex-end; gap:4px; padding:7px 12px 9px;
  background:rgba(255,255,255,0.046);
  backdrop-filter:blur(52px) saturate(200%); -webkit-backdrop-filter:blur(52px) saturate(200%);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;
  box-shadow:0 4px 32px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.07);
  pointer-events:all;
  transition:padding 0.2s var(--ease);
}
.dk-item { display:flex; flex-direction:column; align-items:center; gap:3px; position:relative; }

.dk-icon {
  width:44px; height:44px; border-radius:12px;
  display:flex; align-items:center; justify-content:center; font-size:21px;
  transition:transform 0.22s var(--spring), box-shadow 0.22s;
  will-change:transform; position:relative; z-index:1;
  border:1px solid rgba(255,255,255,0.07);
}
/* JS overrides transform for magnification */
.dk-tooltip {
  position:absolute; bottom:calc(100% + 14px); left:50%;
  transform:translateX(-50%) translateY(5px);
  background:rgba(0,0,0,0.85); backdrop-filter:blur(10px);
  border:1px solid var(--bd2); border-radius:7px;
  padding:4px 10px; font-size:11px; font-weight:500; color:var(--txt);
  white-space:nowrap; pointer-events:none;
  opacity:0; transition:opacity 0.15s,transform 0.15s;
}
.dk-item:hover .dk-tooltip { opacity:1; transform:translateX(-50%) translateY(0); }

.dk-dot {
  width:4px; height:4px; border-radius:50%;
  background:rgba(255,255,255,0.22); transition:background 0.2s;
  box-shadow:0 0 0 rgba(255,255,255,0);
  transition:background 0.3s,box-shadow 0.3s;
}
.dk-item.open .dk-dot {
  background:rgba(255,255,255,0.75);
  box-shadow:0 0 6px rgba(255,255,255,0.4);
  animation:dot-appear 0.3s var(--spring);
}
@keyframes dot-appear { from{transform:scale(0)} to{transform:scale(1)} }

.dk-sep { width:1px; height:34px; background:rgba(255,255,255,0.1); margin:0 5px; align-self:center; }

/* ═══════════════════════════════════════════════════
   WINDOW LAYER
═══════════════════════════════════════════════════ */
#wm { position:absolute; inset:28px 0 70px 0; pointer-events:none; z-index:100; overflow:visible; }

/* ═══════════════════════════════════════════════════
   WINDOWS
═══════════════════════════════════════════════════ */
.win {
  position:absolute; display:flex; flex-direction:column;
  background:var(--surf); border:1px solid rgba(255,255,255,0.1);
  border-radius:12px; overflow:hidden;
  box-shadow:var(--win-shadow-focus);
  min-width:280px; min-height:160px;
  pointer-events:all;
  backdrop-filter:blur(36px) saturate(180%); -webkit-backdrop-filter:blur(36px) saturate(180%);
  transition:box-shadow 0.25s;
  will-change:transform;
}
.win.anim-open     { animation:w-open     0.24s var(--ease) forwards; }
.win.anim-close    { animation:w-close    0.18s ease        forwards; }
.win.anim-minimise { animation:w-minimise 0.25s ease        forwards; }
.win.anim-restore  { animation:w-restore  0.28s var(--ease) forwards; }
@keyframes w-open     { from{opacity:0;transform:scale(0.92) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
@keyframes w-close    { from{opacity:1;transform:scale(1)} to{opacity:0;transform:scale(0.91) translateY(6px)} }
@keyframes w-minimise { from{opacity:1;transform:scale(1) translateY(0)} to{opacity:0;transform:scale(0.7) translateY(80px)} }
@keyframes w-restore  { from{opacity:0;transform:scale(0.7) translateY(80px)} to{opacity:1;transform:scale(1) translateY(0)} }
.win.inactive { box-shadow:var(--win-shadow); }

/* Fullscreen mode */
.win.win-full { border-radius:0 !important; }
.win.win-full .pw-media { max-height:44vh; height:44vh; aspect-ratio:unset; width:100%; }
.win.win-full .pw-info  { padding:16px 24px 20px; }
.win.win-full .aw-body  { padding:24px 32px; }
.win.win-full .aw-skills { grid-template-columns:repeat(4,1fr); }
.win.win-full .tw-out  { font-size:13px; line-height:1.8; }
.win.win-full .cw-body { padding:24px 32px; }

/* Titlebar */
.win-tb {
  height:38px; flex-shrink:0;
  display:flex; align-items:center; padding:0 11px; gap:8px;
  background:rgba(255,255,255,0.025);
  border-bottom:1px solid var(--bd);
  cursor:move; user-select:none; -webkit-user-select:none;
}
.win-tb::before {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent);
}

/* Custom JHOS window buttons — rectangular, symbol appears on hover */
.win-btns { display:flex; gap:5px; flex-shrink:0; }
.win-btn {
  width:26px; height:16px; border-radius:4px;
  background:rgba(255,255,255,0.055);
  border:1px solid rgba(255,255,255,0.08);
  cursor:pointer; flex-shrink:0; position:relative;
  display:flex; align-items:center; justify-content:center;
  transition:background 0.18s, border-color 0.18s;
}
.win-btn svg {
  width:7px; height:7px;
  stroke:rgba(255,255,255,0); fill:none;
  stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round;
  transition:stroke 0.18s;
}
/* Close */
.win-btn-x:hover { background:rgba(255,95,87,0.22); border-color:rgba(255,95,87,0.5); }
.win-btn-x:hover svg { stroke:#ff5f57; }
/* Minimise */
.win-btn-m:hover { background:rgba(254,188,46,0.18); border-color:rgba(254,188,46,0.45); }
.win-btn-m:hover svg { stroke:#febc2e; }
/* Fullscreen */
.win-btn-f:hover { background:rgba(40,200,64,0.15); border-color:rgba(40,200,64,0.4); }
.win-btn-f:hover svg { stroke:#28c840; }

.win-title { flex:1; text-align:center; font-size:12px; font-weight:600; color:var(--txt2); pointer-events:none; letter-spacing:0.01em; }
.win-tb-end { width:42px; flex-shrink:0; }
.win-body { flex:1; overflow:hidden; display:flex; flex-direction:column; }

/* Resize handle */
.win-resize {
  position:absolute; bottom:0; right:0; width:18px; height:18px; cursor:se-resize; z-index:10;
}
.win-resize::after {
  content:''; position:absolute; bottom:4px; right:4px;
  width:7px; height:7px;
  border-right:1.5px solid rgba(255,255,255,0.2);
  border-bottom:1.5px solid rgba(255,255,255,0.2);
  transition:border-color 0.15s;
}
.win:hover .win-resize::after { border-color:rgba(255,255,255,0.4); }

/* ═══════════════════════════════════════════════════
   PROJECT WINDOW
═══════════════════════════════════════════════════ */
.pw-media {
  width:100%; aspect-ratio:16/9; flex-shrink:0; background:#000; position:relative; overflow:hidden;
}
.pw-media img  { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; }
.pw-media video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:2; }
.pw-media::after {
  content:''; position:absolute; top:0; left:0; right:0; height:3px; z-index:3;
  background:var(--pw-accent,var(--blue));
  box-shadow:0 0 16px var(--pw-accent,var(--blue));
  opacity:0.8;
}
/* vignette on media bottom */
.pw-media::before {
  content:''; position:absolute; bottom:0; left:0; right:0; height:40%; z-index:3;
  background:linear-gradient(transparent,rgba(0,0,0,0.4));
  pointer-events:none;
}

.pw-info { padding:15px 17px 18px; overflow-y:auto; flex:1; }
.pw-cat  { font-family:var(--mono); font-size:10px; font-weight:500; text-transform:uppercase; letter-spacing:0.12em; color:var(--pw-accent,var(--blue)); margin-bottom:3px; }
.pw-name { font-size:18px; font-weight:700; letter-spacing:-0.025em; margin-bottom:9px; line-height:1.2; }
.pw-desc { font-size:13px; line-height:1.7; color:var(--txt2); margin-bottom:13px; }
.pw-tags { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:15px; }
.pw-tag  {
  font-family:var(--mono); font-size:10px; padding:3px 8px;
  border:1px solid rgba(255,255,255,0.1); border-radius:5px; color:var(--txt3);
  transition:border-color 0.15s,color 0.15s;
}
.pw-tag:hover { border-color:var(--pw-accent,var(--blue)); color:var(--txt2); }
.pw-open {
  display:inline-flex; align-items:center; gap:7px; padding:9px 18px;
  border-radius:9px; font-size:13px; font-weight:600;
  background:var(--pw-accent,var(--blue)); color:#fff; border:none; cursor:pointer;
  transition:opacity 0.15s,transform 0.15s,box-shadow 0.15s;
  box-shadow:0 4px 16px rgba(0,0,0,0.3);
}
.pw-open:hover { opacity:0.88; transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,0.35); }
.pw-open:active { transform:translateY(0); }

/* ═══════════════════════════════════════════════════
   ABOUT WINDOW
═══════════════════════════════════════════════════ */
.aw-body { padding:22px; overflow-y:auto; flex:1; }
.aw-hero { display:flex; align-items:flex-start; gap:16px; margin-bottom:20px; }
.aw-avatar {
  width:70px; height:70px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,#0a2064,#7700cc);
  display:flex; align-items:center; justify-content:center; font-size:30px;
  border:2px solid rgba(255,255,255,0.1);
  box-shadow:0 0 40px rgba(100,0,200,0.28);
}
.aw-name { font-size:22px; font-weight:700; letter-spacing:-0.025em; margin-bottom:3px; }
.aw-role { font-family:var(--mono); font-size:10px; color:var(--blue); text-transform:uppercase; letter-spacing:0.12em; margin-bottom:6px; }
.aw-loc  { font-size:12px; color:var(--txt3); }
.aw-bio  { font-size:13px; line-height:1.75; color:var(--txt2); margin-bottom:18px; }
.aw-h2   { font-family:var(--mono); font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:0.13em; color:var(--txt3); margin-bottom:10px; }
.aw-skills { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-bottom:18px; }
.aw-skill {
  background:var(--surf2); border:1px solid var(--bd); border-radius:7px;
  padding:7px 8px; font-size:11.5px; font-weight:500; text-align:center; color:var(--txt2);
  transition:border-color 0.15s,color 0.15s;
}
.aw-skill:hover { border-color:var(--blue); color:var(--txt); }
.aw-work { font-size:12px; color:var(--txt2); line-height:1.85; margin-bottom:18px; }
.aw-links { display:flex; gap:7px; flex-wrap:wrap; }
.aw-link {
  display:inline-flex; align-items:center; gap:6px; padding:7px 14px;
  background:var(--surf2); border:1px solid var(--bd2); border-radius:9px;
  font-size:12px; font-weight:500; color:var(--txt);
  transition:border-color 0.15s,color 0.15s,background 0.15s;
}
.aw-link:hover { border-color:var(--blue); color:var(--blue); background:var(--blue-d); }

/* ═══════════════════════════════════════════════════
   TERMINAL WINDOW
═══════════════════════════════════════════════════ */
.tw-out {
  flex:1; overflow-y:auto; padding:12px 14px;
  background:#010108; font-family:var(--mono); font-size:12px; line-height:1.78; color:#a0a0c0;
}
.tw-out .t-prompt { color:#10b981; }
.tw-out .t-cmd    { color:#e8e8f8; }
.tw-out .t-hi     { color:var(--blue); }
.tw-out .t-bold   { color:#fff; font-weight:600; }
.tw-out .t-muted  { color:rgba(160,160,200,0.4); }
.tw-out .t-err    { color:#ff6b6b; }
.tw-out .t-dim    { color:rgba(160,160,200,0.35); }
.tw-out .t-green  { color:#10b981; }
.tw-out .t-yellow { color:#febc2e; }
.tw-out .t-purple { color:#a855f7; }
.tw-out .t-orange { color:#ff6b35; }

.tw-irow {
  display:flex; align-items:center; gap:7px; padding:7px 14px;
  background:#010108; border-top:1px solid rgba(255,255,255,0.05); flex-shrink:0;
}
.tw-ps1 { font-family:var(--mono); font-size:12px; color:#10b981; white-space:nowrap; flex-shrink:0; }
.tw-inp {
  flex:1; background:none; border:none; outline:none;
  font-family:var(--mono); font-size:12px; color:#e8e8f8; caret-color:#10b981;
}

/* ═══════════════════════════════════════════════════
   CONTACT WINDOW
═══════════════════════════════════════════════════ */
.cw-body { padding:22px; overflow-y:auto; flex:1; }
.cw-lead { font-size:14px; line-height:1.68; color:var(--txt2); margin-bottom:18px; }
.cw-list { display:flex; flex-direction:column; gap:9px; }
.cw-item {
  display:flex; align-items:center; gap:12px; padding:12px 14px;
  background:var(--surf2); border:1px solid var(--bd); border-radius:10px;
  cursor:pointer; transition:border-color 0.18s,background 0.18s,transform 0.18s;
}
.cw-item:hover { border-color:var(--blue); background:var(--blue-d); transform:translateX(3px); }
.cw-ico  { font-size:17px; flex-shrink:0; }
.cw-text { flex:1; }
.cw-lbl  { font-size:12.5px; font-weight:600; margin-bottom:1px; }
.cw-val  { font-size:11px; color:var(--txt3); font-family:var(--mono); }
.cw-arr  { color:var(--txt3); font-size:13px; transition:color 0.15s,transform 0.15s; }
.cw-item:hover .cw-arr { color:var(--blue); transform:translateX(2px); }

/* ═══════════════════════════════════════════════════
   MATRIX RAIN OVERLAY
═══════════════════════════════════════════════════ */
#matrix-overlay {
  position:fixed; inset:0; z-index:8000; pointer-events:none;
  animation:fade-in 0.3s ease;
}

/* ═══════════════════════════════════════════════════
   MOBILE SHEET
═══════════════════════════════════════════════════ */
#mob-overlay {
  position:fixed; inset:0; z-index:500;
  background:rgba(0,0,0,0.65); backdrop-filter:blur(6px);
  display:none; align-items:flex-end; justify-content:center; padding:12px;
}
#mob-overlay.on { display:flex; }
#mob-sheet {
  width:100%; max-width:520px; max-height:86vh; overflow:hidden;
  background:var(--surf); border:1px solid var(--bd2); border-radius:18px;
  display:flex; flex-direction:column;
  animation:sheet-up 0.32s var(--ease);
}
@keyframes sheet-up { from{transform:translateY(70px);opacity:0} to{transform:translateY(0);opacity:1} }
.mob-handle { width:36px; height:4px; border-radius:2px; background:var(--bd2); margin:10px auto 0; flex-shrink:0; }
#mob-content { flex:1; overflow-y:auto; overflow-x:hidden; }

/* ═══════════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════════ */
@media (max-width:500px) {
  #d-area { padding:16px 12px; }
  .d-icon-img { width:54px; height:54px; font-size:22px; border-radius:13px; }
  .d-icon { width:62px; gap:5px; }
  .d-icon-grid { gap:12px 10px; }
  .d-icon-name { font-size:10px; }
  #dock-pill { padding:6px 10px 8px; gap:3px; }
  .dk-icon { width:38px; height:38px; font-size:17px; border-radius:10px; }
  #menubar { padding:0 10px; }
  .mb-btn { display:none; }
}

/* ═══════════════════════════════════════════════════
   AURORA BACKGROUND BLOBS
═══════════════════════════════════════════════════ */
.aurora-blob {
  position:absolute; border-radius:50%; pointer-events:none; z-index:0;
  will-change:transform;
}
.aurora-1 {
  width:75vw; height:55vh;
  background:radial-gradient(ellipse,rgba(26,108,255,0.09) 0%,transparent 68%);
  filter:blur(90px);
  top:-20%; left:-15%;
  animation:aurora-drift-1 20s ease-in-out infinite alternate;
}
.aurora-2 {
  width:65vw; height:60vh;
  background:radial-gradient(ellipse,rgba(147,51,234,0.07) 0%,transparent 68%);
  filter:blur(110px);
  top:15%; right:-20%;
  animation:aurora-drift-2 25s ease-in-out infinite alternate;
}
.aurora-3 {
  width:55vw; height:45vh;
  background:radial-gradient(ellipse,rgba(16,185,129,0.05) 0%,transparent 68%);
  filter:blur(100px);
  bottom:-10%; left:25%;
  animation:aurora-drift-3 18s ease-in-out infinite alternate;
}
.aurora-4 {
  width:40vw; height:40vh;
  background:radial-gradient(ellipse,rgba(255,107,53,0.04) 0%,transparent 70%);
  filter:blur(80px);
  top:40%; left:40%;
  animation:aurora-drift-4 30s ease-in-out infinite alternate;
}
@keyframes aurora-drift-1 { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(8%,6%) scale(1.1)} }
@keyframes aurora-drift-2 { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(-10%,8%) scale(1.12)} }
@keyframes aurora-drift-3 { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(6%,-8%) scale(0.95)} }
@keyframes aurora-drift-4 { 0%{transform:translate(0,0) scale(1.05)} 100%{transform:translate(-8%,5%) scale(0.92)} }

/* ═══════════════════════════════════════════════════
   SPOTLIGHT SEARCH
═══════════════════════════════════════════════════ */
#spotlight {
  position:fixed; inset:0; z-index:5000;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  display:flex; align-items:flex-start; justify-content:center;
  padding-top:14vh;
  opacity:0; pointer-events:none;
  transition:opacity 0.2s ease;
}
#spotlight.on { opacity:1; pointer-events:all; }
#spotlight-box {
  width:600px; max-width:92vw;
  background:rgba(8,8,22,0.95);
  border:1px solid rgba(255,255,255,0.13);
  border-radius:18px; overflow:hidden;
  box-shadow:0 48px 120px rgba(0,0,0,0.85),0 0 0 1px rgba(255,255,255,0.04),0 0 80px rgba(26,108,255,0.08);
  transform:scale(0.95) translateY(-10px);
  transition:transform 0.22s var(--ease);
}
#spotlight.on #spotlight-box { transform:scale(1) translateY(0); }
#sp-input-row {
  display:flex; align-items:center; gap:14px;
  padding:18px 22px; border-bottom:1px solid rgba(255,255,255,0.07);
}
#sp-input-row svg { flex-shrink:0; opacity:0.4; }
#sp-input {
  flex:1; background:none; border:none; outline:none;
  font-family:var(--font); font-size:18px; font-weight:400;
  color:var(--txt); caret-color:var(--blue);
}
#sp-input::placeholder { color:var(--txt3); }
#sp-input-row .sp-kbd {
  font-family:var(--mono); font-size:10px; color:var(--txt3);
  background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1);
  border-radius:5px; padding:2px 7px; flex-shrink:0;
}
#sp-results { max-height:380px; overflow-y:auto; padding:8px; }
.sp-sec {
  font-family:var(--mono); font-size:9px; font-weight:600;
  letter-spacing:0.16em; text-transform:uppercase;
  color:var(--txt3); padding:10px 14px 5px;
}
.sp-item {
  display:flex; align-items:center; gap:13px;
  padding:10px 14px; border-radius:11px; cursor:pointer;
  transition:background 0.1s;
}
.sp-item:hover,.sp-item.sp-sel { background:rgba(255,255,255,0.07); }
.sp-item.sp-sel { background:rgba(26,108,255,0.14); }
.sp-ico {
  width:38px; height:38px; border-radius:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:19px;
}
.sp-text { flex:1; min-width:0; }
.sp-name { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp-sub  { font-size:11px; color:var(--txt3); margin-top:1px; }
.sp-enter {
  font-family:var(--mono); font-size:10px; color:var(--txt3);
  background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1);
  border-radius:5px; padding:2px 7px; flex-shrink:0; opacity:0; transition:opacity 0.15s;
}
.sp-item.sp-sel .sp-enter { opacity:1; }
#sp-empty {
  padding:30px; text-align:center;
  font-size:13px; color:var(--txt3); font-family:var(--mono);
}

/* ═══════════════════════════════════════════════════
   RIGHT-CLICK CONTEXT MENU
═══════════════════════════════════════════════════ */
#ctx-menu {
  position:fixed; z-index:4500;
  background:rgba(10,10,24,0.96);
  backdrop-filter:blur(32px); -webkit-backdrop-filter:blur(32px);
  border:1px solid rgba(255,255,255,0.12); border-radius:13px;
  padding:6px; min-width:210px;
  box-shadow:0 20px 60px rgba(0,0,0,0.75),0 0 0 1px rgba(255,255,255,0.04);
  display:none;
  animation:ctx-pop 0.13s var(--ease);
  transform-origin:top left;
}
@keyframes ctx-pop { from{opacity:0;transform:scale(0.92)} to{opacity:1;transform:scale(1)} }
.ctx-item {
  display:flex; align-items:center; gap:10px;
  padding:8px 13px; border-radius:8px; cursor:pointer;
  font-size:13px; font-weight:500; color:var(--txt2);
  transition:background 0.1s,color 0.1s;
  user-select:none;
}
.ctx-item:hover { background:rgba(255,255,255,0.09); color:var(--txt); }
.ctx-item.ctx-danger:hover { background:rgba(255,95,87,0.12); color:var(--red); }
.ctx-item-icon { font-size:14px; flex-shrink:0; width:18px; text-align:center; }
.ctx-shortcut { font-family:var(--mono); font-size:10px; color:var(--txt3); margin-left:auto; padding-left:16px; }
.ctx-sep { height:1px; background:rgba(255,255,255,0.07); margin:4px 0; }

/* ═══════════════════════════════════════════════════
   TOAST NOTIFICATIONS
═══════════════════════════════════════════════════ */
#toast-stack {
  position:fixed; bottom:90px; right:18px; z-index:6000;
  display:flex; flex-direction:column; gap:8px; pointer-events:none;
  align-items:flex-end;
}
.toast {
  display:flex; align-items:center; gap:10px; padding:11px 16px;
  background:rgba(10,10,26,0.96);
  backdrop-filter:blur(32px); -webkit-backdrop-filter:blur(32px);
  border:1px solid rgba(255,255,255,0.1); border-radius:13px;
  font-size:13px; font-weight:500; color:var(--txt);
  box-shadow:0 8px 32px rgba(0,0,0,0.55);
  animation:toast-in 0.3s var(--ease);
  pointer-events:all; cursor:default;
  min-width:180px; max-width:300px;
  position:relative; overflow:hidden;
}
.toast::after {
  content:''; position:absolute; bottom:0; left:0; height:2px;
  background:var(--toast-accent,var(--blue));
  width:100%; transform-origin:left;
  animation:toast-bar var(--toast-dur,3s) linear forwards;
}
@keyframes toast-bar { from{transform:scaleX(1)} to{transform:scaleX(0)} }
.toast.toast-out { animation:toast-out 0.25s ease forwards; }
@keyframes toast-in  { from{opacity:0;transform:translateX(18px) scale(0.95)} to{opacity:1;transform:translateX(0) scale(1)} }
@keyframes toast-out { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(22px)} }
.toast-ico { font-size:16px; flex-shrink:0; }

/* ═══════════════════════════════════════════════════
   SCREENSAVER
═══════════════════════════════════════════════════ */
#screensaver {
  position:fixed; inset:0; z-index:9000;
  background:#000; cursor:none;
  display:none; flex-direction:column; align-items:center; justify-content:center;
}
#screensaver.on { display:flex; }
#ss-canvas { position:absolute; inset:0; }
#ss-clock {
  position:relative; z-index:1;
  font-family:var(--mono); font-size:72px; font-weight:200; letter-spacing:-0.04em;
  color:rgba(255,255,255,0.82); text-shadow:0 0 80px rgba(26,108,255,0.6);
  pointer-events:none; user-select:none;
  animation:ss-float 8s ease-in-out infinite;
}
#ss-date {
  position:relative; z-index:1;
  font-family:var(--mono); font-size:16px; font-weight:400;
  color:rgba(255,255,255,0.3); margin-top:10px; letter-spacing:0.1em;
  pointer-events:none; user-select:none;
}
#ss-hint {
  position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
  font-family:var(--mono); font-size:11px; color:rgba(255,255,255,0.2);
  letter-spacing:0.08em; pointer-events:none; z-index:1;
  animation:ss-hint-fade 4s ease-in-out infinite;
}
@keyframes ss-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
@keyframes ss-hint-fade { 0%,100%{opacity:0.3} 50%{opacity:0.8} }

/* ═══════════════════════════════════════════════════
   MISSION CONTROL (all windows overview)
═══════════════════════════════════════════════════ */
#mission-ctrl {
  position:fixed; inset:0; z-index:3500;
  background:rgba(0,0,0,0.72);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:16px;
  padding:60px 40px 100px;
}
#mission-ctrl.on { display:flex; }
#mc-label {
  font-family:var(--mono); font-size:11px; letter-spacing:0.14em;
  text-transform:uppercase; color:var(--txt3); margin-bottom:8px;
}
#mc-grid {
  display:flex; gap:16px; flex-wrap:wrap; align-items:center; justify-content:center;
  max-width:1100px;
}
.mc-thumb {
  width:220px; border-radius:12px; overflow:hidden;
  border:2px solid rgba(255,255,255,0.1);
  cursor:pointer; transition:transform 0.2s var(--spring), border-color 0.2s;
  background:var(--surf);
  animation:mc-in 0.28s var(--ease) both;
}
.mc-thumb:hover { transform:scale(1.05); border-color:rgba(255,255,255,0.35); }
@keyframes mc-in { from{opacity:0;transform:scale(0.85) translateY(16px)} to{opacity:1;transform:scale(1) translateY(0)} }
.mc-thumb-bar {
  height:22px; background:rgba(255,255,255,0.04);
  border-bottom:1px solid rgba(255,255,255,0.07);
  display:flex; align-items:center; padding:0 8px; gap:5px;
}
.mc-tb-dot { width:8px; height:8px; border-radius:2px; background:rgba(255,255,255,0.12); }
.mc-thumb-title { font-size:9px; color:var(--txt3); padding:0 8px; font-family:var(--mono); flex:1; text-align:center; }
.mc-thumb-body {
  height:130px; overflow:hidden; display:flex; align-items:flex-start; justify-content:center;
  background:var(--surf2); padding:8px; font-size:10px; color:var(--txt3);
}
#mc-hint {
  font-family:var(--mono); font-size:11px; color:var(--txt3);
  letter-spacing:0.06em; margin-top:8px;
}

/* ═══════════════════════════════════════════════════
   MENUBAR EXTRAS
═══════════════════════════════════════════════════ */
.mb-divider { width:1px; height:14px; background:rgba(255,255,255,0.1); margin:0 4px; }
.mb-status-icon {
  font-size:11px; color:var(--txt2); cursor:default;
  font-family:var(--mono); letter-spacing:0.04em;
  padding:2px 6px; border-radius:4px;
  transition:background 0.15s, color 0.15s;
}
.mb-status-icon:hover { background:rgba(255,255,255,0.07); color:var(--txt); }
.mb-date { font-family:var(--mono); font-size:11px; color:var(--txt2); margin-right:4px; }

/* ═══════════════════════════════════════════════════
   KEYBOARD SHORTCUT HINT
═══════════════════════════════════════════════════ */
#kb-hint {
  position:absolute; bottom:80px; right:16px; z-index:50;
  font-family:var(--mono); font-size:10px; color:rgba(255,255,255,0.2);
  letter-spacing:0.06em; pointer-events:none; user-select:none;
  animation:fade-in 1.5s ease 4s both;
}
#kb-hint kbd {
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  border-radius:4px; padding:1px 5px; font-family:var(--mono); font-size:10px;
}

/* ═══════════════════════════════════════════════════
   WINDOW ACCENT FOCUS GLOW
═══════════════════════════════════════════════════ */
.win[data-accent]:not(.inactive) {
  box-shadow:var(--win-shadow-focus),0 0 60px var(--win-accent-glow,rgba(26,108,255,0.08));
}

/* ═══════════════════════════════════════════════════
   QUICK LAUNCH RIPPLE
═══════════════════════════════════════════════════ */
@keyframes icon-launch {
  0%   { transform:scale(1) translateY(-5px); }
  30%  { transform:scale(0.88) translateY(2px); }
  60%  { transform:scale(1.06) translateY(-7px); }

const SFX = (() => {
  let ac = null;
  const get = () => { if (!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); return ac; };
  function tone(freq, endFreq, type, vol, dur) {
    try {
      const ctx = get(); const t = ctx.currentTime;
      const osc = ctx.createOscillator(); const g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type = type||'sine'; osc.frequency.setValueAtTime(freq, t);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t+dur*0.7);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      osc.start(t); osc.stop(t+dur);
    } catch(e) {}
  }
  return {
    open:    () => tone(440, 880,  'sine',     0.05, 0.22),
    close:   () => tone(660, 330,  'sine',     0.04, 0.18),
    notify:  () => { tone(880,1100,'sine',0.035,0.15); setTimeout(()=>tone(1100,880,'sine',0.025,0.12),100); },

    launch:  () => tone(330, 660,  'triangle', 0.04, 0.28),
    spotlight:()=> tone(700, 1000, 'sine',     0.03, 0.15),

})();

  bootPct += Math.random() * 15 + 8;

  if (mi !== bootMI) { bootMI = mi; bootMsg.textContent = BOOT_MSGS[mi]; }
  if (bootPct < 100) { setTimeout(bootTick, 90 + Math.random() * 90); return; }

/* ═══════════════════════════════════════════════════
   CANVAS BACKGROUND
═══════════════════════════════════════════════════ */
function initCanvas() {
  const cv = document.getElementById('bg-canvas');
  const cx = cv.getContext('2d');
  let W, H, pts, mx = -999, my = -999;

  function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; makePts(); }

  function makePts() {
    const n = Math.max(50, Math.floor(W * H / 14000));
    pts = Array.from({length: n}, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx:(Math.random()-.5)*.22, vy:(Math.random()-.5)*.22,
      r: Math.random() * 1.6 + 0.4,
      hue: Math.random() > 0.85 ? 260 : 210, // occasional purple stars
    }));
  }

  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

  const LINK = 140, MDIST = 150;

  function frame() {
    cx.clearRect(0, 0, W, H);
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      cx.fillStyle = `hsla(${p.hue},80%,70%,0.22)`; cx.fill();
    }
    for (let i = 0; i < pts.length; i++) {
      for (let j = i+1; j < pts.length; j++) {
        const dx = pts[i].x-pts[j].x, dy = pts[i].y-pts[j].y;
        const d = Math.hypot(dx, dy);
        if (d < LINK) {
          const a = (1-d/LINK) * 0.07;
          cx.beginPath(); cx.moveTo(pts[i].x,pts[i].y); cx.lineTo(pts[j].x,pts[j].y);
          cx.strokeStyle = `rgba(80,120,255,${a})`; cx.lineWidth = 0.8; cx.stroke();
        }
      }
      const dxm = pts[i].x-mx, dym = pts[i].y-my, dm = Math.hypot(dxm,dym);
      if (dm < MDIST) {
        const f = (1-dm/MDIST) * 0.014;
        pts[i].vx += dxm*f; pts[i].vy += dym*f;
        const sp = Math.hypot(pts[i].vx,pts[i].vy);
        if (sp > 1.4) { pts[i].vx = pts[i].vx/sp*1.4; pts[i].vy = pts[i].vy/sp*1.4; }
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
}

          <svg viewBox="0 0 7 7"><path d="M1 2.5V1h1.5M5.5 1H7v1.5M1 4.5V6h1.5M5.5 6H7V4.5"/></svg>
        </button>

      <div class="win-tb-end"></div>
    </div>
    <div class="win-body">${content}</div>
    <div class="win-resize"></div>`;

  wmEl.appendChild(el);
  bringFront(el);
  el.addEventListener('mousedown', () => bringFront(el));
  el.querySelector('.win-btn-x').addEventListener('click', e => { e.stopPropagation(); closeWin(id); });
  el.querySelector('.win-btn-m').addEventListener('click', e => {
    e.stopPropagation(); minimiseWin(id);
  });
  el.querySelector('.win-btn-f').addEventListener('click', e => {
    e.stopPropagation();
    if (el.dataset.full==='1') {
      const s = JSON.parse(el.dataset.prev||'{}');
      el.style.left=s.l+'px'; el.style.top=s.t+'px'; el.style.width=s.w+'px'; el.style.height=s.h+'px';
      el.dataset.full=''; el.classList.remove('win-full');
    } else {
      el.dataset.prev = JSON.stringify({l:parseInt(el.style.left),t:parseInt(el.style.top),w:parseInt(el.style.width),h:parseInt(el.style.height)});
      el.style.left='0'; el.style.top='0';
      el.style.width=wmEl.offsetWidth+'px'; el.style.height=wmEl.offsetHeight+'px';
      el.dataset.full='1'; el.classList.add('win-full');
    }
  });
  makeDraggable(el, el.querySelector('.win-tb'));
  makeResizable(el, el.querySelector('.win-resize'));
  const vid = el.querySelector('video');
  if (vid) { vid.muted=true; vid.loop=true; vid.playsInline=true; vid.play().catch(()=>{}); }
  openWins[id] = { el, minimised:false };
  updateDockDots(); updateIconDots();
  return el;
}

function closeWin(id) {
  const wn = openWins[id]; if (!wn) return;
  SFX.close();
  const vid = wn.el.querySelector('video'); if (vid) vid.pause();
  wn.el.classList.add('anim-close');
  removeTaskbarItem(id);
  setTimeout(() => { wn.el.remove(); delete openWins[id]; updateDockDots(); updateIconDots(); }, 180);
}

function minimiseWin(id) {
  const wn = openWins[id]; if (!wn || wn.minimised) return;
  wn.el.classList.add('anim-minimise');
  setTimeout(() => {
    wn.el.style.display = 'none';
    wn.el.classList.remove('anim-minimise');
    wn.minimised = true;
    addTaskbarItem(id);
    updateDockDots(); updateIconDots();
  }, 250);
}

function restoreWin(id) {
  const wn = openWins[id]; if (!wn) return;
  wn.el.style.display = '';
  wn.el.classList.add('anim-restore');
  wn.minimised = false;
  setTimeout(() => wn.el.classList.remove('anim-restore'), 280);
  bringFront(wn.el);
  removeTaskbarItem(id);
  updateDockDots(); updateIconDots();
}

function addTaskbarItem(id) {
  const wn = openWins[id]; if (!wn) return;
  const title = wn.el.querySelector('.win-title')?.textContent?.trim() || id;
  const tb = document.getElementById('taskbar'); if (!tb) return;
  if (tb.querySelector(`[data-tid="${id}"]`)) return; // already there
  const item = document.createElement('div');
  item.className = 'tb-item'; item.dataset.tid = id;
  item.innerHTML = `<span class="tb-dot"></span><span>${title}</span><button class="tb-close" title="Close">×</button>`;
  item.addEventListener('click', e => { if (!e.target.classList.contains('tb-close')) restoreWin(id); });
  item.querySelector('.tb-close').addEventListener('click', e => { e.stopPropagation(); closeWin(id); });
  tb.appendChild(item);
}

function removeTaskbarItem(id) {
  document.querySelector(`#taskbar [data-tid="${id}"]`)?.remove();
}

function makeDraggable(win, handle) {
  let on=false, ox,oy,sx,sy;
  handle.addEventListener('mousedown', e => {
    if (e.target.classList.contains('win-btn')) return;
    on=true; sx=e.clientX; sy=e.clientY;
    ox=parseInt(win.style.left)||0; oy=parseInt(win.style.top)||0;
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!on) return;
    win.style.left=(ox+e.clientX-sx)+'px';
    win.style.top =Math.max(-28, oy+e.clientY-sy)+'px';
  });
  document.addEventListener('mouseup', () => { on=false; });
}

function makeResizable(win, handle) {
  if (!handle) return;
  let on=false, sx,sy,sw,sh;
  handle.addEventListener('mousedown', e => {
    on=true; sx=e.clientX; sy=e.clientY;
    sw=parseInt(win.style.width); sh=parseInt(win.style.height);
    e.preventDefault(); e.stopPropagation();
  });
  document.addEventListener('mousemove', e => {
    if (!on) return;
    win.style.width  = Math.max(300, sw+e.clientX-sx)+'px';
    win.style.height = Math.max(200, sh+e.clientY-sy)+'px';
  });
  document.addEventListener('mouseup', () => { on=false; });
}

function runMatrix() {
  const ov = document.createElement('canvas');
  ov.id = 'matrix-overlay';
  ov.style.cssText = 'position:fixed;inset:0;z-index:8000;pointer-events:none;';
  ov.width = window.innerWidth; ov.height = window.innerHeight;
  document.body.appendChild(ov);
  const ctx = ov.getContext('2d');
  const cols = Math.floor(ov.width/14);
  const drops = Array(cols).fill(1);
  const chars = 'ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ABCDEF';
  let rafId;
  function draw() {
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0,0,ov.width,ov.height);
    ctx.font = '14px monospace';
    for (let i = 0; i < drops.length; i++) {
      ctx.fillStyle = i % 5 === 0 ? '#fff' : '#0f0';
      ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*14, drops[i]*14);
      if (drops[i]*14 > ov.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
    rafId = requestAnimationFrame(draw);
  }
  draw();
  setTimeout(() => { cancelAnimationFrame(rafId); ov.remove(); }, 6000);
}

function setTheme(name) {

  const c = MAP[name?.toLowerCase()];
  if (!c) return `Unknown theme. Available: <span class="t-hi">${Object.keys(MAP).join(' · ')}</span>`;
  document.documentElement.style.setProperty('--blue', c);
  document.documentElement.style.setProperty('--blue-d', c + '28');
  return `<span class="t-green">Theme set to</span> <span style="color:${c}">■</span> ${name}`;
}

function processCmd(raw, out) {
  const cmd = raw.trim();
  out.innerHTML += `\n<span class="t-prompt">jimi@jhos:~$</span> <span class="t-cmd">${escHtml(cmd)}</span>\n`;
  const parts = cmd.split(/\s+/);
  const base  = parts[0].toLowerCase();
  let res = '';

  if (base === 'clear')   { out.innerHTML = ''; return; }
  if (base === 'matrix')  { runMatrix(); res = '<span class="t-green">Entering the Matrix...</span>'; }
  else if (base === 'hack')  { runHack(out); return; }
  else if (base === 'flip')  {
    deskEl.style.transition = 'transform 0.6s ease';
    deskEl.style.transform = 'rotate(180deg)';
    setTimeout(() => { deskEl.style.transform = ''; }, 3000);
    res = '<span class="t-green">Flipping desktop in 3... 2... 1...</span>';
  }
  else if (base === 'theme') { res = setTheme(parts[1]); }
  else if (base === 'ls')    { res = lsText(); }
  else if (base === 'open')  {
    const id = parts[1];
    if (!id) { res = '<span class="t-err">Usage: open &lt;id&gt;</span>'; }
    else {
      const p = PROJECTS.find(x => x.id === id);
      if (!p) res = `<span class="t-err">Not found: ${escHtml(id)}</span>  →  try <span class="t-hi">ls</span>`;
      else { openProject(p); res = `<span class="t-green">Opening ${p.title}…</span>`; }
    }
  }
  else if (base === 'date') { res = TERM_DATA.date(); }
  else if (base === 'whoami') { res = TERM_DATA.whoami; }
  else if (TERM_DATA[base] && typeof TERM_DATA[base] === 'string') { res = TERM_DATA[base]; }
  else if (cmd === '') { /* nothing */ }
  else { res = `<span class="t-err">command not found: ${escHtml(cmd)}</span>  →  <span class="t-hi">help</span>`; }

  if (res) out.innerHTML += `<span>${res}</span>\n`;
  out.scrollTop = out.scrollHeight;
}

/* ═══════════════════════════════════════════════════
   DESKTOP ICONS + DRAG-AND-DROP
═══════════════════════════════════════════════════ */
function loadIconOrder() {
  try { return JSON.parse(localStorage.getItem('jhos-icon-order') || 'null'); } catch { return null; }
}
function saveIconOrder() {
  const order = [...document.querySelectorAll('.d-icon')].map(el => el.dataset.pid);
  localStorage.setItem('jhos-icon-order', JSON.stringify(order));
}

function buildDesktop() {
  const area = document.getElementById('d-area');
  const savedOrder = loadIconOrder();

  SECTIONS.forEach(sec => {
    let projs = PROJECTS.filter(p => p.sec === sec.id);
    // Apply saved order within section
    if (savedOrder) {
      projs = savedOrder
        .map(id => projs.find(p => p.id === id))
        .filter(Boolean)
        .concat(projs.filter(p => !savedOrder.includes(p.id)));
    }

    const sect = document.createElement('div');
    sect.className = 'd-section';

    // section label
    const lbl = document.createElement('div');
    lbl.className = 'd-cat-label';
    lbl.style.color = sec.accent;
    lbl.innerHTML = `<div class="d-cat-label-dot" style="background:${sec.accent}"></div><span class="d-cat-label-text">${sec.label}</span><div class="d-cat-label-line"></div>`;
    sect.appendChild(lbl);

    const grid = document.createElement('div');
    grid.className = 'd-icon-grid';
    grid.dataset.section = sec.id;

    projs.forEach(p => {
      grid.appendChild(makeIcon(p));
    });

    sect.appendChild(grid);
    area.appendChild(sect);
  });

  // enable drag-and-drop
  initIconDnd();
}

function makeIcon(p) {
  const icon = document.createElement('div');
  icon.className = 'd-icon';
  icon.dataset.pid = p.id;
  icon.draggable = true;
  icon.innerHTML = `
    <div class="d-icon-img" style="background:linear-gradient(145deg,${p.bg[0]},${p.bg[1]});--icon-glow:${p.glow}">
      <span>${p.emoji}</span>
    </div>
    <span class="d-icon-name">${p.title}</span>
    <div class="d-icon-open-dot"></div>`;
  icon.addEventListener('click', () => openProject(p));
  return icon;
}

let dndSrc = null;

function initIconDnd() {
  document.querySelectorAll('.d-icon').forEach(ic => {
    ic.addEventListener('dragstart', e => {
      dndSrc = ic;
      ic.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', ic.dataset.pid);
    });
    ic.addEventListener('dragend', () => {
      dndSrc?.classList.remove('dragging');
      document.querySelectorAll('.d-icon.drop-target').forEach(el => el.classList.remove('drop-target'));
      dndSrc = null;
      saveIconOrder();
    });
    ic.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (ic !== dndSrc) ic.classList.add('drop-target');
    });
    ic.addEventListener('dragleave', () => ic.classList.remove('drop-target'));
    ic.addEventListener('drop', e => {
      e.preventDefault();
      ic.classList.remove('drop-target');
      if (!dndSrc || dndSrc === ic) return;
      // Insert dndSrc before ic
      ic.parentNode.insertBefore(dndSrc, ic);
      saveIconOrder();
    });
  });
}

function updateIconDots() {
  document.querySelectorAll('.d-icon').forEach(ico => {
    const id = ico.dataset.pid;
    const wn = openWins[id];
    ico.classList.toggle('is-open', !!(wn && !wn.minimised));
  });
}

/* ═══════════════════════════════════════════════════
   DOCK
═══════════════════════════════════════════════════ */
function buildDock() {
  const pill = document.getElementById('dock-pill');
  DOCK_DEF.forEach(d => {
    if (d.sep) {
      const s = document.createElement('div'); s.className = 'dk-sep'; pill.appendChild(s); return;
    }
    const el = document.createElement('div');
    el.className = 'dk-item'; el.dataset.did = d.id;
    el.innerHTML = `<div class="dk-icon" style="background:${d.bg}">${d.emoji}</div><div class="dk-tooltip">${d.label}</div><div class="dk-dot"></div>`;
    el.addEventListener('click', () => {
      const wn = openWins[d.id];
      if (wn?.minimised) restoreWin(d.id);
      else d.action();
    });
    pill.appendChild(el);
  });

  // rAF-batched magnification for silky smooth scaling
  const pill2 = document.getElementById('dock-pill');
  let _mx = null, _raf = false, _hovering = false;

  pill2.addEventListener('mouseenter', () => { _hovering = true; });
  pill2.addEventListener('mouseleave', () => {
    _hovering = false; _mx = null;
    // spring back with smooth transition
    document.querySelectorAll('.dk-icon').forEach(ic => {
      ic.style.transition = 'transform 0.32s cubic-bezier(0.34,1.3,0.64,1)';
      ic.style.transform = '';
    });
  });
  pill2.addEventListener('mousemove', e => {
    _mx = e.clientX;
    if (!_raf) { _raf = true; requestAnimationFrame(_applyMag); }
  });

  function _applyMag() {
    _raf = false;
    if (!_hovering || _mx === null) return;
    document.querySelectorAll('.dk-item').forEach(item => {
      const ic = item.querySelector('.dk-icon');
      if (!ic) return;
      const r  = ic.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const d  = Math.abs(_mx - cx);
      const MAX = 90;
      if (d < MAX) {
        const t = 1 - d / MAX;
        const s = 1 + 0.62 * t * t * t;
        const y = (s - 1) * 24;
        ic.style.transition = 'transform 0.06s linear';
        ic.style.transform  = `scale(${s.toFixed(4)}) translateY(-${y.toFixed(2)}px)`;
      } else {
        ic.style.transition = 'transform 0.18s cubic-bezier(0.22,1,0.36,1)';
        ic.style.transform  = '';
      }
    });
    if (_hovering && _mx !== null) { _raf = true; requestAnimationFrame(_applyMag); }
  }
}

function updateDockDots() {
  document.querySelectorAll('.dk-item').forEach(el => {
    const id = el.dataset.did;
    const wn = openWins[id];
    el.classList.toggle('open', !!(wn && !wn.minimised));
  });
}

/* ═══════════════════════════════════════════════════
   STAGGER ICONS
═══════════════════════════════════════════════════ */
function staggerIcons() {
  document.querySelectorAll('.d-icon').forEach((ic, i) => {
    ic.style.opacity = '0';
    ic.style.transform = 'translateY(16px) scale(0.9)';
    ic.style.transition = `opacity 0.4s ease ${i*26}ms, transform 0.45s var(--ease) ${i*26}ms`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      ic.style.opacity = '1';
      ic.style.transform = '';
    }));
  });
}

   UTIL

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let _ready = false;

  if (_ready) return; _ready = true;

/* ═══════════════════════════════════════════════════
   TOAST SYSTEM
═══════════════════════════════════════════════════ */
function showToast(msg, accent, dur=3000) {
  const stack = document.getElementById('toast-stack');
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.setProperty('--toast-accent', accent||'var(--blue)');
  el.style.setProperty('--toast-dur', (dur/1000)+'s');
  el.innerHTML = `<span class="toast-ico">${msg.split('  ')[0]||'ℹ'}</span><span>${msg.split('  ')[1]||msg}</span>`;
  stack.appendChild(el);
  SFX.notify();
  setTimeout(() => {
    el.classList.add('toast-out');
    setTimeout(() => el.remove(), 260);
  }, dur);
}

/* ═══════════════════════════════════════════════════
   SPOTLIGHT SEARCH
═══════════════════════════════════════════════════ */
let spSel = -1;
let spItems = [];

function openSpotlight() {
  SFX.spotlight();
  document.getElementById('spotlight').classList.add('on');
  document.getElementById('sp-input').value = '';
  document.getElementById('sp-input').focus();
  renderSpResults('');
  resetIdleTimer();
}
function closeSpotlight() {
  document.getElementById('spotlight').classList.remove('on');
  document.getElementById('sp-input').blur();
}
function initSpotlight() {
  const overlay = document.getElementById('spotlight');
  const input   = document.getElementById('sp-input');
  overlay.addEventListener('click', e => { if (e.target === overlay) closeSpotlight(); });
  input.addEventListener('input', () => renderSpResults(input.value));
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeSpotlight(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); spSelMove(1); }
    if (e.key === 'ArrowUp')   { e.preventDefault(); spSelMove(-1); }
    if (e.key === 'Enter') {
      e.preventDefault();
      const sel = spItems[spSel];
      if (sel) { sel.action(); closeSpotlight(); }
      else if (spItems.length) { spItems[0].action(); closeSpotlight(); }
    }
  });
}
function renderSpResults(q) {
  const res = document.getElementById('sp-results');
  q = q.trim().toLowerCase();
  spItems = [];
  spSel = -1;

  // Projects
  const matchedProjects = PROJECTS.filter(p =>
    !q || p.title.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q) ||
    p.tags.some(t => t.toLowerCase().includes(q)) || p.desc.toLowerCase().includes(q)
  );

  // Commands
  const CMDS = [
    { name:'About Jimi', sub:'Open about window',         icon:'👤',  action: openAbout },
    { name:'Terminal',   sub:'Open terminal',             icon:'⌨',   action: openTerminal },
    { name:'Contact',    sub:'Get in touch',              icon:'✉',   action: openContact },
    { name:'Matrix',     sub:'Hidden command',            icon:'🟢',  action: ()=>{ openTerminal(); setTimeout(()=>{ const inp=document.getElementById('tw-inp'); if(inp){inp.value='matrix'; inp.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true})); }},200); } },
    { name:'Mission Control',sub:'View all windows',      icon:'⊞',   action: showMissionCtrl },
    { name:'Screensaver', sub:'Start screensaver',        icon:'💤',  action: triggerScreensaver },
  ];
  const matchedCmds = CMDS.filter(c => !q || c.name.toLowerCase().includes(q) || c.sub.toLowerCase().includes(q));

  if (!matchedProjects.length && !matchedCmds.length) {
    res.innerHTML = `<div id="sp-empty">No results for "<strong>${escHtml(q)}</strong>"</div>`;
    return;
  }

  let html = '';
  if (matchedProjects.length) {
    html += `<div class="sp-sec">Apps &amp; Games</div>`;
    matchedProjects.slice(0,8).forEach((p,i) => {
      const idx = spItems.length;
      spItems.push({ action: () => openProject(p) });
      html += `<div class="sp-item" data-spidx="${idx}">
        <div class="sp-ico" style="background:linear-gradient(135deg,${p.bg[0]},${p.bg[1]})">${p.emoji}</div>
        <div class="sp-text"><div class="sp-name">${p.title}</div><div class="sp-sub">${p.cat} · ${p.tags.slice(0,2).join(', ')}</div></div>
        <span class="sp-enter">↵</span>
      </div>`;
    });
  }
  if (matchedCmds.length) {
    html += `<div class="sp-sec">Commands</div>`;
    matchedCmds.slice(0,4).forEach(c => {
      const idx = spItems.length;
      spItems.push({ action: c.action });
      html += `<div class="sp-item" data-spidx="${idx}">
        <div class="sp-ico" style="background:rgba(255,255,255,0.07)">${c.icon}</div>
        <div class="sp-text"><div class="sp-name">${c.name}</div><div class="sp-sub">${c.sub}</div></div>
        <span class="sp-enter">↵</span>
      </div>`;
    });
  }
  res.innerHTML = html;

  // bind clicks
  res.querySelectorAll('.sp-item').forEach(el => {
    el.addEventListener('mouseenter', () => { spSel = +el.dataset.spidx; highlightSp(); });
    el.addEventListener('click', () => {
      const item = spItems[+el.dataset.spidx];
      if (item) { item.action(); closeSpotlight(); }
    });
  });
}
function spSelMove(dir) {
  spSel = Math.max(-1, Math.min(spItems.length-1, spSel+dir));
  highlightSp();
}
function highlightSp() {
  document.querySelectorAll('#sp-results .sp-item').forEach(el => {
    el.classList.toggle('sp-sel', +el.dataset.spidx === spSel);
  });
  const active = document.querySelector('#sp-results .sp-item.sp-sel');
  if (active) active.scrollIntoView({ block:'nearest' });
}

/* ═══════════════════════════════════════════════════
   CONTEXT MENU
═══════════════════════════════════════════════════ */
function initContextMenu() {
  const menu = document.getElementById('ctx-menu');
  document.getElementById('d-area').addEventListener('contextmenu', e => {
    e.preventDefault();
    showCtx(e.clientX, e.clientY);
  });
  document.addEventListener('click', e => {
    if (!menu.contains(e.target)) hideCtx();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCtx(); });
}
function showCtx(x, y) {
  const menu = document.getElementById('ctx-menu');
  menu.style.display = 'block';
  menu.style.left = Math.min(x, window.innerWidth  - 220) + 'px';
  menu.style.top  = Math.min(y, window.innerHeight - 260) + 'px';
  menu.style.animation = 'none'; menu.offsetHeight; menu.style.animation = '';
}
function hideCtx() {
  document.getElementById('ctx-menu').style.display = 'none';
}

/* ═══════════════════════════════════════════════════
   KEYBOARD SHORTCUTS
═══════════════════════════════════════════════════ */
function initKeyboardShortcuts() {
  document.addEventListener('keydown', e => {
    const meta = e.metaKey || e.ctrlKey;

    // ⌘K — spotlight
    if (meta && e.key === 'k') { e.preventDefault(); openSpotlight(); return; }

    // ⌘T — terminal
    if (meta && e.key === 't') { e.preventDefault(); openTerminal(); return; }

    // ⌘W — close focused window
    if (meta && e.key === 'w') {
      e.preventDefault();
      const wins = [...document.querySelectorAll('.win')];
      const top = wins.reduce((a,b) => (+b.style.zIndex||0)>(+a.style.zIndex||0)?b:a, wins[0]||null);
      if (top) {
        const id = Object.keys(openWins).find(k => openWins[k].el === top);
        if (id) closeWin(id);
      }
      return;
    }

    // ⌘M — minimise focused window
    if (meta && e.key === 'm') {
      e.preventDefault();
      const wins = [...document.querySelectorAll('.win')];
      const top = wins.reduce((a,b) => (+b.style.zIndex||0)>(+a.style.zIndex||0)?b:a, wins[0]||null);
      if (top) {
        const id = Object.keys(openWins).find(k => openWins[k].el === top);
        if (id) minimiseWin(id);
      }
      return;
    }

    // ⌘↑ — mission control
    if (meta && e.key === 'ArrowUp') { e.preventDefault(); showMissionCtrl(); return; }

    // Escape — close spotlight or mission control
    if (e.key === 'Escape') {
      closeSpotlight();
      hideMissionCtrl();
      hideCtx();
    }
  });
}

/* ═══════════════════════════════════════════════════
   MISSION CONTROL
═══════════════════════════════════════════════════ */
function showMissionCtrl() {
  const wins = Object.entries(openWins).filter(([,wn])=>!wn.minimised);
  if (!wins.length) { showToast('⊞  No open windows','var(--blue)'); return; }
  const mc = document.getElementById('mission-ctrl');
  const grid = document.getElementById('mc-grid');
  grid.innerHTML = '';
  wins.forEach(([id, wn], i) => {
    const title = wn.el.querySelector('.win-title')?.textContent?.trim() || id;
    const emoji = wn.el.querySelector('.win-tb-emoji')?.textContent || '';
    const thumb = document.createElement('div');
    thumb.className = 'mc-thumb';
    thumb.style.animationDelay = i*0.05+'s';
    thumb.innerHTML = `
      <div class="mc-thumb-bar">
        <div class="mc-tb-dot"></div><div class="mc-tb-dot"></div><div class="mc-tb-dot"></div>
        <div class="mc-thumb-title">${emoji} ${title}</div>
      </div>
      <div class="mc-thumb-body"><span>${emoji}<br><small>${title}</small></span></div>`;
    thumb.addEventListener('click', e => {
      e.stopPropagation();
      hideMissionCtrl();
      if (wn.minimised) restoreWin(id); else bringFront(wn.el);
    });
    grid.appendChild(thumb);
  });
  mc.classList.add('on');
}
function hideMissionCtrl(e) {
  if (e && e.target !== document.getElementById('mission-ctrl')) return;
  document.getElementById('mission-ctrl').classList.remove('on');
}

/* ═══════════════════════════════════════════════════
   SCREENSAVER
═══════════════════════════════════════════════════ */
let ssTimer = null, ssActive = false;

function initScreensaver() {
  resetIdleTimer();
  ['mousemove','mousedown','keydown','touchstart','scroll'].forEach(ev =>
    document.addEventListener(ev, resetIdleTimer, { passive:true })
  );
  const ss = document.getElementById('screensaver');
  ss.addEventListener('click', wakeFromSS);
  document.addEventListener('keydown', e => { if (ssActive) { wakeFromSS(); e.preventDefault(); } });
}

function resetIdleTimer() {
  if (ssActive) return;
  clearTimeout(ssTimer);
  ssTimer = setTimeout(triggerScreensaver, 90000); // 90s idle
}

function triggerScreensaver() {
  if (ssActive) return;
  ssActive = true;
  const ss = document.getElementById('screensaver');
  ss.classList.add('on');
  startSSCanvas();
  updateSSClock();
  ssClockTimer = setInterval(updateSSClock, 1000);
}

let ssClockTimer = null, ssRaf = null;

function updateSSClock() {
  const d = new Date();
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  const s = String(d.getSeconds()).padStart(2,'0');
  const clockEl = document.getElementById('ss-clock');
  const dateEl  = document.getElementById('ss-date');
  if (clockEl) clockEl.textContent = `${h}:${m}:${s}`;
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  if (dateEl) dateEl.textContent = `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
}

function wakeFromSS() {
  if (!ssActive) return;
  ssActive = false;
  clearInterval(ssClockTimer);
  if (ssRaf) { cancelAnimationFrame(ssRaf); ssRaf = null; }
  document.getElementById('screensaver').classList.remove('on');
  resetIdleTimer();
}

function startSSCanvas() {
  const cv = document.getElementById('ss-canvas');
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const ctx = cv.getContext('2d');
  const stars = Array.from({length:200}, () => ({
    x: Math.random()*cv.width, y: Math.random()*cv.height,
    vx:(Math.random()-.5)*0.5, vy:-Math.random()*1.2-0.3,
    r: Math.random()*1.5+0.2, alpha:Math.random()
  }));
  function draw() {
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(0,0,cv.width,cv.height);
    stars.forEach(s => {
      s.x += s.vx; s.y += s.vy;
      if (s.y < -2) { s.y = cv.height+2; s.x = Math.random()*cv.width; }
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${120+Math.random()*80},${150+Math.random()*80},255,${0.4+s.alpha*0.4})`;
      ctx.fill();
    });
    ssRaf = requestAnimationFrame(draw);
  }
  draw();
}

/* ═══════════════════════════════════════════════════

const THEMES = ['#1a6cff','#a855f7','#10b981','#f59e0b','#ef4444','#ec4899','#06b6d4','#ff6b35'];
let themeIdx = 0;
function cycleTheme() {
  themeIdx = (themeIdx+1) % THEMES.length;
  const c = THEMES[themeIdx];
  document.documentElement.style.setProperty('--blue', c);
  document.documentElement.style.setProperty('--blue-d', c+'28');
  showToast('🎨  Accent changed', c);
}

/* ═══════════════════════════════════════════════════
   KONAMI CODE
═══════════════════════════════════════════════════ */
function initKonami() {
  const seq = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  let pos = 0;
  document.addEventListener('keydown', e => {
    if (e.key === seq[pos]) { pos++; } else { pos = 0; }
    if (pos === seq.length) {
      pos = 0;
      // Jiggle all icons
      document.querySelectorAll('.d-icon-img').forEach((ic,i) => {
        ic.style.animation = 'none'; ic.offsetHeight;
        ic.style.animation = `konami-jiggle 0.5s ease ${i*30}ms`;
      });
      showToast('🕹  +30 lives. You found it!', '#a855f7', 4000);
      SFX.notify();
    }
  });
}
