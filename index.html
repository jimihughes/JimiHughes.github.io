<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jimi Hughes — JimiOS</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="description" content="JimiOS — the portfolio of Jimi Hughes, booted as a fully simulated desktop operating system in your browser. AI projects, games, and a live trading terminal.">
  <meta property="og:title" content="Jimi Hughes — JimiOS">
  <meta property="og:description" content="A portfolio that boots like an operating system. AI apps, games, live trading terminal.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jimihughes.com">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="os.css">
</head>
<body>

<!-- boot screen -->
<div id="boot">
  <div id="boot-log"></div>
  <div id="boot-bottom">
    <div id="boot-brand">Jimi<em>OS</em></div>
    <div id="boot-bar"><div id="boot-bar-fill"></div></div>
    <div id="boot-hint">TIP: try typing a sudo command while booting…</div>
    <div id="boot-secret"></div>
  </div>
</div>

<!-- desktop -->
<main id="desktop">
  <div id="wallpaper"><canvas id="wp-canvas"></canvas><div id="wp-tint"></div></div>
  <div id="icons"></div>
  <div id="windows"></div>
</main>

<!-- floating chrome -->
<div id="snap-preview"></div>
<div id="holo" class="holo"></div>

<!-- taskbar -->
<nav id="taskbar">
  <button id="tb-start"><span class="logo">J</span><span>JimiOS</span></button>
  <div id="tb-apps"></div>
  <div id="tb-tray">
    <button class="tray-btn" id="tray-sound" title="Toggle UI sounds">🔊</button>
    <button class="tray-btn" id="tray-theme" title="Toggle theme">◐</button>
    <button class="tray-btn" id="tray-notif" title="Notifications">🔔<span class="dot"></span></button>
    <div id="tb-clock"><div id="tb-time">--:--</div><div id="tb-date"></div></div>
  </div>
</nav>

<!-- start menu -->
<div id="start-menu">
  <input id="sm-search" placeholder="Search apps… (Alt+Space)" spellcheck="false" autocomplete="off">
  <div class="sm-h">Applications</div>
  <div id="sm-apps"></div>
  <div id="sm-quick">
    <button class="sm-quick-btn" onclick="WM.open('settings')">⚙ Settings</button>
    <button class="sm-quick-btn" onclick="WM.open('contact')">📬 Contact</button>
    <button class="sm-quick-btn" onclick="window.open('https://www.linkedin.com/in/jimi-hughes-a0b33737b','_blank')">💼 LinkedIn</button>
  </div>
</div>

<!-- notification centre -->
<div id="notif-panel"></div>

<!-- context menu -->
<div id="ctx-menu"></div>

<!-- toasts -->
<div id="toasts"></div>

<!-- screensaver -->
<div id="screensaver"><canvas id="ss-canvas"></canvas></div>

<!-- scanline texture -->
<div id="scanlines"></div>

<!-- mobile gate -->
<div id="mobile-gate">
  <div id="mg-logo">J</div>
  <div id="mg-title">Jimi<em>OS</em></div>
  <div id="mg-sub">Mobile device detected.<br>JimiOS is a full desktop operating system — it runs best on a bigger screen. Meanwhile:</div>
  <div class="mg-links">
    <a class="mg-link" href="https://www.linkedin.com/in/jimi-hughes-a0b33737b" target="_blank" rel="noopener">💼 LinkedIn</a>
    <a class="mg-link" href="quiz/">🧠 Play the Multiplayer Quiz</a>
    <a class="mg-link" href="mailto:jimifh0111@gmail.com">📬 Email me</a>
  </div>
</div>

<script src="js/wm.js"></script>
<script src="js/apps.js"></script>
<script src="js/main.js"></script>
<script>
// tray quick toggles (small enough to live here)
document.getElementById('tray-theme').addEventListener('click', () => {
  JOS.setTheme(JOS.prefs.theme === 'dark' ? 'light' : 'dark');
});
document.getElementById('tray-sound').addEventListener('click', function() {
  const on = JOS.togglePref('sounds');
  this.textContent = on ? '🔊' : '🔇';
});
</script>
</body>
</html>
